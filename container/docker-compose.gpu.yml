# nvidia gpus into phosphorus for the status tab's nvidia-smi, and into
# phosphorus-model for llama-server, added by rebuild only where a --gpus
# probe container starts
services:
  phosphorus:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  model:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
