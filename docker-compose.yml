# one project name wherever the install lives, its volumes with it
name: phosphorus

services:
  # the release's images, pulled from ghcr and tagged by rebuild
  phosphorus:
    image: phosphorus:latest
    container_name: phosphorus
    restart: unless-stopped

    # the host's network stack, for services at its Tailscale address and
    # the ingress on port 80
    network_mode: host

    # the host's processes, for the status tab
    pid: host

    # a fallback resolver, since MagicDNS only answers once tailscaled has
    # logged in
    dns:
      - 100.100.100.100
      - 1.1.1.1
    dns_search:
      - tailc2cc6a.ts.net

    # for tailscaled inside this container
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]

    env_file: .env

    environment:
      # what /files actually resolves to, so the frontend can tell a changed [files]
      # dir from the one this container was created with
      PHOSPHORUS_FILES_DIR: ${PHOSPHORUS_FILES_DIR:-./files}
      # [home] dir: its home/ (the users, shared/ and sys/) under /homefs, the
      # host path kept for the frontend
      HOME_FS: /homefs
      PHOSPHORUS_HOME_DIR: ${PHOSPHORUS_HOME_DIR:-./files}
      # the tailnet and mesh name, empty: the container's hostname
      TS_HOSTNAME: ${TS_HOSTNAME:-}
      # set by rebuild where /hostfs holds the host's drives, empty: the
      # status tab's disk counts only the binds below
      PHOSPHORUS_HOST_ROOT: ${PHOSPHORUS_HOST_ROOT:-}

    volumes:
      # tailscaled's identity, persisted across rebuilds
      - tailscale-state:/var/lib/tailscale

      # this machine's own declarations, read only, a directory since a
      # file mount's fixed inode misses an editor's atomic save
      - ./config:/etc/phosphorus:ro

      # this host's own bookkeeping, never published: chat cache, tailnet
      # view, git, model, update and project records
      - ./state:/state

      # [home] dir from config/phosphorus.ini, its home/ holding each user's
      # folder, shared/ and sys/ (the mesh's users and settings), unset: files/ below
      - ${PHOSPHORUS_HOME_DIR:-./files}:/homefs

      # [files] dir from config/phosphorus.ini, for the web's Files tab, read-write,
      # unset: the home's files/
      - ${PHOSPHORUS_FILES_DIR:-./files}:/files

      # the home, for reconfig's rebuild and the model's reading, never /opt/phosphorus
      # (the image's own VERSION and sweep.sh)
      - .:/repo

      # every drive of the host, read only, for the status tab's disk, never
      # served by the Files tab, without rebuild just state again
      - ${PHOSPHORUS_HOST_ROOT:-./state}:/hostfs:ro

      # opencode, fetched by phosphorus-model, run by the frontend, Windows:
      # phosphorus-models, off the slow NTFS share
      - ${PHOSPHORUS_MODEL_DIR:-./state/models}:/models

      # for rebuild.sh's sibling swap container, out of the swap's reach
      - /var/run/docker.sock:/var/run/docker.sock

  # llama-server on the model host alone, its tools and gguf in /models,
  # reached on loopback by the frontend's host networking, its name from
  # phosphorus's self-host
  model:
    image: phosphorus-model:latest
    container_name: phosphorus-model
    restart: unless-stopped
    profiles: ["model-host"]
    depends_on: [phosphorus]
    network_mode: host
    init: true
    # the model's weights locked in ram
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - ./config:/etc/phosphorus:ro
      - ./state:/state
      - ${PHOSPHORUS_MODEL_DIR:-./state/models}:/models

  # phosphorus's web search, on model hosts only, published on loopback only, where
  # the frontend's host networking reaches it, the rest asking a model host's frontend
  search:
    image: searxng/searxng:latest
    container_name: phosphorus-search
    restart: unless-stopped
    profiles: ["model-host"]
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./container/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # optional git-host, its own container: supervisor.sh killing everything
  # when one child exits, litefs restarting on every flip
  git:
    image: phosphorus-git:latest
    container_name: phosphorus-git
    restart: unless-stopped
    profiles: ["git-host"]
    depends_on: [phosphorus]
    # for the git host's own subdomain, nothing else from .env
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}

    # host networking for tailnet reach, /dev/fuse for litefs
    network_mode: host
    cap_add: [SYS_ADMIN]
    devices: ["/dev/fuse"]
    # default apparmor denying mount(2), and with it fusermount3
    security_opt: ["apparmor:unconfined"]
    dns:
      - 100.100.100.100
      - 1.1.1.1
    dns_search:
      - tailc2cc6a.ts.net

    volumes:
      # data root, litefs/ litefs-managed, never rsynced
      # Windows: phosphorus-git-data, off the slow NTFS share
      - ${PHOSPHORUS_GIT_DATA:-./git/data}:/var/lib/phosphorus/git

      # litefs's real db store, mounted or a rebuild wipes forgejo's db
      - ${PHOSPHORUS_GIT_DB:-./git/data/litefs-internal}:/var/lib/litefs-internal

      # shared with phosphorus: self-host, git-role, the elector's claim
      - ./state:/state

volumes:
  tailscale-state:
  # the git host's data on Windows, seeded once from git/data by rebuild
  git-data:
    name: phosphorus-git-data
  git-db:
    name: phosphorus-git-db
  models:
    name: phosphorus-models
