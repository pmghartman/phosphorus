[package]
name = "hesperus-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Hesperus tray app: install, bring-up and updates on macOS and Windows"

[[bin]]
name = "Hesperus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
