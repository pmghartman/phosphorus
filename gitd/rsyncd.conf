# rendered by git-daemon.sh; no auth, tailnet membership the trust boundary,
# the LAN reached too, so only the CGNAT range may pull
port = 8873
hosts allow = 100.64.0.0/10
hosts deny = *
use chroot = false
# daemon default nobody, unable to read git-owned 600/750 files
uid = root
gid = root
pid file = __PID__

[gitdata]
    path = __ROOT__
    read only = true
    list = false
    # peers pull conf/custom/obj/snap only, the live db kept out
    exclude = /db/
    # set by the elector while a new master's final pull lands
    pre-xfer exec = test ! -e __PROMOTING__
