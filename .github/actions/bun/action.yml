# bun at package.json's pin and the workspace installed; its package cache in one
# place on every OS, kept between runs, a new lockfile starting from the last one's
name: bun
description: Set up bun and install the workspace

runs:
  using: composite
  steps:
    - shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=$GITHUB_WORKSPACE/.bun-cache" >> "$GITHUB_ENV"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .bun-cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
