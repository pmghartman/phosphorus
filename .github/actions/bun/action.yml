# bun at package.json's pin and the workspace installed, without dev tools when asked;
# its package cache in one place on every OS, kept between runs, a new lockfile
# starting from the last one's
name: bun
description: Set up bun and install the workspace

inputs:
  production:
    description: "true: without devDependencies, for jobs that only compile or sign"
    default: "false"
  afterglow:
    description: "an afterglow release tag (vX.Y) pinned before installing, the lockfile updated to it"
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=$GITHUB_WORKSPACE/.bun-cache" >> "$GITHUB_ENV"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .bun-cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.production }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.production }}-
    # afterglow at the tag asked for: the lockfile follows it, everything else stays frozen
    - shell: bash
      env:
        AG: ${{ inputs.afterglow }}
      run: |
        frozen=--frozen-lockfile
        if [ -n "$AG" ]; then
          bun scripts/afterglow.ts "$AG"
          # git's index can call a same-length pin edit clean, so never frozen here
          frozen=
        fi
        bun install $frozen ${{ inputs.production == 'true' && '--production' || '' }}
