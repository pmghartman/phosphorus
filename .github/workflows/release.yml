# manual release: per checked OS a host installer (.deb, .dmg, setup .exe), as
# vVERSION, and with Sulfur checked the Sulfur code editor's own app for every OS
# (Tauri around its local server: setup .exe, .dmg, .deb and AppImage);
# feeds on release `update` for the hosts and Sulfur built, then only the two newest
# releases and runs kept
# app and apt feeds need UPDATE_SIGNING_KEY (go run ./cmd/feedsign -keygen), APT_GPG_KEY, var UPDATE_PUBKEY
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false
      linux_amd64:
        description: "Linux amd64"
        type: boolean
        default: false
      linux_arm64:
        description: "Linux arm64"
        type: boolean
        default: false
      macos:
        description: "MacOS"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: false
      sulfur:
        description: "Sulfur IDE"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      builds: ${{ steps.plan.outputs.builds }}
      sulfur: ${{ steps.plan.outputs.sulfur }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # every run one past the highest vMAJOR.MINOR tag: minor, or major with .0
      - name: next version
        id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
      - name: plan
        id: plan
        env:
          AMD64: ${{ inputs.linux_amd64 }}
          ARM64: ${{ inputs.linux_arm64 }}
          MAC: ${{ inputs.macos }}
          WIN: ${{ inputs.windows }}
          SULFUR: ${{ inputs.sulfur }}
        run: |
          on() { for v in "$@"; do [ "$v" = true ] && return 0; done; return 1; }
          on "$AMD64" "$ARM64" "$MAC" "$WIN" "$SULFUR" || { echo "check at least one OS, or Sulfur" >&2; exit 1; }
          la='{"name":"linux-amd64","runner":"ubuntu-24.04","arch":"amd64"}'
          lb='{"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}'
          mc='{"name":"macos-universal","runner":"macos-14","arch":"universal"}'
          wn='{"name":"windows-x86_64","runner":"windows-2022","arch":"amd64"}'
          builds=()
          [ "$AMD64" = true ] && builds+=("$la")
          [ "$ARM64" = true ] && builds+=("$lb")
          [ "$MAC" = true ] && builds+=("$mc")
          [ "$WIN" = true ] && builds+=("$wn")
          # an empty matrix fails its job: a placeholder the jobs' if skips
          j() { [ $# -gt 0 ] || set -- '{"name":"none"}'; local IFS=,; echo "[$*]"; }
          echo "builds=$(j "${builds[@]}")" | tee -a "$GITHUB_OUTPUT"
          # Sulfur's app on every OS, whichever hosts were checked: its own bundles per OS
          sulfur=()
          if [ "$SULFUR" = true ]; then
            sulfur+=('{"name":"linux-amd64","runner":"ubuntu-24.04","bundles":"deb,appimage","target":"","triple":"x86_64-unknown-linux-gnu"}')
            sulfur+=('{"name":"linux-arm64","runner":"ubuntu-24.04-arm","bundles":"deb","target":"","triple":"aarch64-unknown-linux-gnu"}')
            sulfur+=('{"name":"macos-universal","runner":"macos-14","bundles":"app,dmg","target":"universal-apple-darwin","triple":"universal-apple-darwin"}')
            sulfur+=('{"name":"windows-x86_64","runner":"windows-2022","bundles":"nsis","target":"","triple":"x86_64-pc-windows-msvc"}')
          fi
          echo "sulfur=$(j "${sulfur[@]}")" | tee -a "$GITHUB_OUTPUT"

  # the web client built once, from pinned npm tarballs, for every job that embeds it
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/.vendor/cache
          key: web-vendor-${{ hashFiles('web/vendor.lock') }}
      # a binary without it serves nothing but 404s; Sulfur's page in it too
      - run: go generate ./internal/web && test -f internal/web/dist/index.html && test -f internal/web/dist/sulfur/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: internal/web/dist/
          retention-days: 1
      # the shipped license texts current with every dependency and pinned tool; here, where
      # the npm packages are
      - name: licenses
        run: |
          go run ./cmd/licenses
          git diff --exit-code THIRD_PARTY_LICENSES.txt || { echo "THIRD_PARTY_LICENSES.txt is stale, run make licenses and commit it" >&2; exit 1; }

  # vet and tests, gating the release
  check:
    needs: [web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # the module proxy drops streams now and then
      - run: for i in 1 2 3 4; do go mod download && exit 0; sleep $((i * 5)); done; exit 1
      # the web client the web job built, into internal/web/dist before anything embeds it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: internal/web/dist
      # every package cross-vetted too: macOS and Windows hosts run the same roles
      - run: go vet ./... && go test ./... && GOOS=darwin go vet ./... && GOOS=windows go vet ./...

  # one job per OS, Go alone: Linux's host the .deb around the binary, macOS's
  # and Windows' the menu bar app beside it, in a .dmg and a setup .exe
  build:
    needs: [version, web]
    if: ${{ inputs.linux_amd64 || inputs.linux_arm64 || inputs.macos || inputs.windows }}
    strategy:
      # one OS's failure leaves the others' builds, and their caches, finished
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    env:
      VER: ${{ needs.version.outputs.ver }}
      APP: packaging/host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # apt key's public half, into the host package
      - name: apt key
        if: startsWith(matrix.name, 'linux')
        env:
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          export GNUPGHOME=$(mktemp -d)
          echo "$KEY" | gpg --batch --import
          gpg --export > "$RUNNER_TEMP/phosphorus.gpg"
          echo "PHOSPHORUS_APT_KEY=$RUNNER_TEMP/phosphorus.gpg" >> "$GITHUB_ENV"
      # the web client the web job built, into internal/web/dist before anything embeds it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: internal/web/dist
      # the release's tree (.github and packaging export-ignored) and its bundled tools;
      # Linux's packaged at once, the tools fetched beside the Go build
      - name: host binary
        shell: bash
        run: |
          mkdir -p out upd art $APP/payload
          git archive HEAD | tar -x -C $APP/payload && echo "$VER" > $APP/payload/VERSION
          cp THIRD_PARTY_LICENSES.txt out/
          b() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" -o "$3" ./cmd/phosphorus; }
          case "${{ matrix.name }}" in
            linux-*)
              packaging/tools.sh linux ${{ matrix.arch }} art/tools > art/tools.log 2>&1 & t=$!
              # forgejo's corresponding source beside the package carrying its binary
              packaging/tools.sh source any out > art/src.log 2>&1 & s=$!
              b linux ${{ matrix.arch }} art/phosphorus
              wait $t || { cat art/tools.log; exit 1; }
              wait $s || { cat art/src.log; exit 1; }
              packaging/deb/build.sh "out/phosphorus_${VER}_${{ matrix.arch }}.deb" "$VER" $APP/payload ${{ matrix.arch }} art/phosphorus art/tools ;;
            macos-universal)
              packaging/tools.sh darwin universal $APP/payload/tools > art/tools.log 2>&1 || { cat art/tools.log; exit 1; } ;;
            windows-*)
              packaging/tools.sh windows amd64 $APP/payload/tools > art/tools.log 2>&1 || { cat art/tools.log; exit 1; } ;;
          esac
      # the menu bar app around the host binary and release; its own update, signed
      # for the feed, only with the signing key
      - name: host app
        if: ${{ !startsWith(matrix.name, 'linux') }}
        shell: bash
        env:
          FEED_URL: https://github.com/${{ github.repository }}/releases/download/update
          FEED_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ "${{ matrix.name }}" = macos-universal ]; then
            $APP/macos.sh "$VER" $APP/payload out upd
          else
            $APP/windows.sh "$VER" "$PWD/$APP/payload" "$PWD/out" "$PWD/upd"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: out-${{ matrix.name }}
          path: out/
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upd-${{ matrix.name }}
          path: upd/
          compression-level: 0
          if-no-files-found: ignore

  # Sulfur's own app: Tauri around its local server (cmd/sulfur), which serves Sulfur
  # alone and this computer offline, or fronts a mesh; installers for every OS
  sulfur:
    needs: [version, web]
    if: ${{ inputs.sulfur }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.sulfur) }}
    runs-on: ${{ matrix.runner }}
    env:
      VER: ${{ needs.version.outputs.ver }}
      APP: packaging/sulfur
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # the web client the web job built, into internal/web/dist before anything embeds it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: internal/web/dist
      # the server the app runs, Sulfur's page built into it, named as Tauri finds a bundled binary;
      # the feed it updates from and the key its updates are signed with
      - name: server
        env:
          FEED_URL: https://github.com/${{ github.repository }}/releases/download/update
          FEED_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
        run: |
          bin=$APP/src-tauri/binaries
          mkdir -p "$bin"
          b() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w $3 -X main.version=$VER -X main.feedURL=$FEED_URL -X main.feedPubkey=$FEED_PUBKEY" -o "$4" ./cmd/sulfur; }
          case "${{ matrix.name }}" in
            windows-*) b windows amd64 "-H windowsgui" "$bin/sulfur-server-${{ matrix.triple }}.exe" ;;
            linux-amd64) b linux amd64 "" "$bin/sulfur-server-${{ matrix.triple }}" ;;
            linux-arm64) b linux arm64 "" "$bin/sulfur-server-${{ matrix.triple }}" ;;
            macos-*)
              b darwin arm64 "" "$bin/sulfur-server-aarch64-apple-darwin"
              b darwin amd64 "" "$bin/sulfur-server-x86_64-apple-darwin"
              lipo -create -output "$bin/sulfur-server-universal-apple-darwin" "$bin/sulfur-server-aarch64-apple-darwin" "$bin/sulfur-server-x86_64-apple-darwin" ;;
          esac
          ls -l "$bin"
      # WebKitGTK and the AppImage's tools, Tauri's Linux needs
      - name: linux deps
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      # the runner's own rustup, both Mac architectures for a universal app
      - name: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      # the crates and their builds kept across releases, pruned to what this lock still uses
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packaging/sulfur/src-tauri
          key: ${{ matrix.name }}
      # the release's version as semver; the bundles in out/ under the release's names;
      # the cli pinned, so a release builds the same each time
      - name: build
        working-directory: ${{ env.APP }}
        run: |
          args=(--bundles "${{ matrix.bundles }}" --config "{\"version\":\"$VER.0\"}")
          [ -n "${{ matrix.target }}" ] && args+=(--target "${{ matrix.target }}")
          for i in 1 2 3; do npx --yes @tauri-apps/cli@2.12.2 build "${args[@]}" -- --locked && break; [ $i = 3 ] && exit 1; sleep $((i * 10)); done
          out=$GITHUB_WORKSPACE/out
          mkdir -p "$out"
          base=src-tauri/target/${{ matrix.target }}/release/bundle
          [ -n "${{ matrix.target }}" ] || base=src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$base"/nsis/*-setup.exe; do cp "$f" "$out/sulfur-$VER-${{ matrix.name }}-setup.exe"; done
          for f in "$base"/dmg/*.dmg; do cp "$f" "$out/sulfur-$VER-${{ matrix.name }}.dmg"; done
          for f in "$base"/deb/*.deb; do cp "$f" "$out/sulfur_${VER}_${f##*_}"; done
          for f in "$base"/appimage/*.AppImage; do cp "$f" "$out/sulfur-$VER-${{ matrix.name }}.AppImage"; done
          ls -l "$out"
          [ -n "$(ls -A "$out")" ] || { echo "no bundles made" >&2; exit 1; }
          # the app's own update, signed for the feed: the setup .exe, the .app tarred, the AppImage
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            upd=$GITHUB_WORKSPACE/upd
            mkdir -p "$upd"
            case "${{ matrix.name }}" in
              windows-*) cp "$out/sulfur-$VER-${{ matrix.name }}-setup.exe" "$upd/sulfur-windows-x86_64-setup.exe" ;;
              macos-*)
                app=$(find "$base" -maxdepth 2 -name "Sulfur.app" -type d | head -n 1)
                [ -n "$app" ] || { echo "no Sulfur.app under $base" >&2; exit 1; }
                tar -czf "$upd/sulfur-macos-universal.app.tar.gz" -C "$(dirname "$app")" Sulfur.app ;;
              linux-amd64) cp "$out/sulfur-$VER-${{ matrix.name }}.AppImage" "$upd/sulfur-linux-x86_64.AppImage" ;;
            esac
            if [ -n "$(ls -A "$upd")" ]; then (cd "$GITHUB_WORKSPACE" && go run ./cmd/feedsign "$upd"/*); fi
          fi
        env:
          FEED_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: out-sulfur-${{ matrix.name }}
          path: out/
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upd-sulfur-${{ matrix.name }}
          path: upd/
          compression-level: 0
          if-no-files-found: ignore

  release:
    needs: [version, check, build, sulfur]
    # runs with unchecked OSes skipped, not when anything failed
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: out
          pattern: out-*
          merge-multiple: true
      # the notes: how to install, the assets listed by GitHub under them
      - name: notes
        run: |
          cd out
          {
            shopt -s nullglob
            # the install steps, each OS's only when built
            echo "You need a [Tailscale](https://tailscale.com) account and a reusable auth key."
            echo
            step() { echo "- $1"; }
            [ -e phosphorus-$VER-macos-universal.dmg ] && step "**macOS:** open the \`.dmg\`, drag Phosphorus to Applications, open it (first time: right-click, Open). It lives in the menu bar."
            [ -e phosphorus-$VER-windows-x86_64-setup.exe ] && step "**Windows:** run the setup \`.exe\` (SmartScreen: More info, Run anyway). It lives in the tray."
            ls phosphorus_${VER}_*.deb >/dev/null 2>&1 && step "**Linux:** \`sudo apt install ./phosphorus_${VER}_ARCH.deb\`, then \`sudo phosphorus\`."
            echo
            echo "Then enter the Tailscale auth key when asked; every other host copies the rest from the mesh. Open \`http://HOST\` from any device on the tailnet, by a host's name or tailnet IP. The first login is \`admin\` with your admin password."
            echo
            echo "Installed hosts update themselves: **Check for Updates** in the menu bar or tray, \`phos update all\`, or the mesh update in the browser, every host at once."
            # Sulfur's desktop app, when it was built
            if ls sulfur[-_]* >/dev/null 2>&1; then
              echo
              echo "**Sulfur:** the code editor on its own, for any computer: **Start Offline** for its own files, terminals and compilers, or connect to your mesh for its machines and agents. Install the \`sulfur-…-setup.exe\`, the \`.dmg\` (first time: right-click, Open), or \`sudo apt install ./sulfur_${VER}_ARCH.deb\`."
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VER }}
          name: Phosphorus ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: out/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: upd
          pattern: upd-*
          merge-multiple: true
      # built OSes' files onto `update`; others: last release's. A release of Sulfur
      # alone writes Sulfur's feed only, so no host's told of an update with nothing in it
      - name: update feed
        if: ${{ inputs.linux_amd64 || inputs.linux_arm64 || inputs.macos || inputs.windows || inputs.sulfur }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          mkdir -p upd && cd upd
          BASE=https://github.com/$GH_REPO/releases/download/update
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ${{ inputs.linux_amd64 || inputs.linux_arm64 || inputs.macos || inputs.windows }}; then
            printf '{"version":"%s","pub_date":"%s","notes":"https://github.com/%s/releases/tag/v%s"}\n' "$VER" "$NOW" "$GH_REPO" "$VER" > latest.json
          fi
          feed() { printf '{"version":"%s","url":"%s/%s","signature":"%s"}\n' "$VER" "$BASE" "$2" "$(cat "$2.sig")" > "$1.json"; }
          if [ -e phosphorus-macos-universal.app.tar.gz ]; then
            feed darwin-x86_64 phosphorus-macos-universal.app.tar.gz
            feed darwin-aarch64 phosphorus-macos-universal.app.tar.gz
          fi
          if [ -e phosphorus-windows-x86_64-setup.exe ]; then feed windows-x86_64 phosphorus-windows-x86_64-setup.exe; fi
          # Sulfur's app: its own feed files beside the host's
          if [ -e sulfur-macos-universal.app.tar.gz ]; then
            feed sulfur-darwin-x86_64 sulfur-macos-universal.app.tar.gz
            feed sulfur-darwin-aarch64 sulfur-macos-universal.app.tar.gz
          fi
          if [ -e sulfur-windows-x86_64-setup.exe ]; then feed sulfur-windows-x86_64 sulfur-windows-x86_64-setup.exe; fi
          if [ -e sulfur-linux-x86_64.AppImage ]; then feed sulfur-linux-x86_64 sulfur-linux-x86_64.AppImage; fi
          # Linux hosts update over apt
          # the apt feed: the host packages alone
          if [ -n "$KEY" ] && ls ../out/phosphorus_*.deb >/dev/null 2>&1; then
            command -v apt-ftparchive >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q apt-utils; }
            # the unchecked arch's index kept from the last release
            gh release download update -p 'Packages-*' || true
            for f in ../out/phosphorus_*.deb; do
              d=${f##*_}; d=${d%.deb} n=${f##*/}; n=${n%%_*}
              mkdir -p "a-$d" && cp "$f" "a-$d/${n}_$d.deb"
              (cd "a-$d" && apt-ftparchive packages .) > "Packages-$d"
              mv "a-$d/${n}_$d.deb" . && rmdir "a-$d"
            done
            cat Packages-* > Packages
            # agents' apt-get allows the Origin and Label change
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Phosphorus -o APT::FTPArchive::Release::Label=Phosphorus release . > "$RUNNER_TEMP/Release"
            export GNUPGHOME=$(mktemp -d)
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --clearsign -o InRelease "$RUNNER_TEMP/Release"
          fi
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title "Update feed" --notes "Files installed hosts update from. Install from the numbered releases."
          gh release upload update * --clobber

  # only the two newest numbered releases and their tags kept, the `update` feed
  # aside; only this workflow's two newest runs, this one included
  prune:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: releases
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do
            echo "deleting release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
      - name: runs
        run: |
          gh run list --workflow release.yml --limit 200 --json databaseId,createdAt,status --jq 'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            echo "deleting run $id"
            gh run delete "$id" || true
          done
