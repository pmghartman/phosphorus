# manual release: per checked OS a host installer (.deb, .dmg, setup .exe), as
# vVERSION; feeds on release `update`, then only the two newest releases and runs kept
# app and apt feeds need TAURI_SIGNING_PRIVATE_KEY(_PASSWORD), APT_GPG_KEY, var TAURI_UPDATER_PUBKEY
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false
      linux_amd64:
        description: "Linux amd64"
        type: boolean
        default: false
      linux_arm64:
        description: "Linux arm64"
        type: boolean
        default: false
      macos:
        description: "MacOS"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # every run one past the highest vMAJOR.MINOR tag: minor, or major with .0
      - name: next version
        id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
      - name: plan
        id: plan
        env:
          AMD64: ${{ inputs.linux_amd64 }}
          ARM64: ${{ inputs.linux_arm64 }}
          MAC: ${{ inputs.macos }}
          WIN: ${{ inputs.windows }}
        run: |
          on() { for v in "$@"; do [ "$v" = true ] && return 0; done; return 1; }
          on "$AMD64" "$ARM64" "$MAC" "$WIN" || { echo "check at least one OS" >&2; exit 1; }
          la='{"name":"linux-amd64","runner":"ubuntu-24.04","arch":"amd64","args":"--bundles deb"}'
          lb='{"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64","args":"--bundles deb"}'
          mc='{"name":"macos-universal","runner":"macos-14","arch":"universal","args":"--target universal-apple-darwin --bundles app,dmg"}'
          wn='{"name":"windows-x86_64","runner":"windows-2022","arch":"amd64","args":"--bundles nsis"}'
          builds=()
          [ "$AMD64" = true ] && builds+=("$la")
          [ "$ARM64" = true ] && builds+=("$lb")
          [ "$MAC" = true ] && builds+=("$mc")
          [ "$WIN" = true ] && builds+=("$wn")
          # an empty matrix fails its job: a placeholder the jobs' if skips
          j() { [ $# -gt 0 ] || set -- '{"name":"none"}'; local IFS=,; echo "[$*]"; }
          echo "builds=$(j "${builds[@]}")" | tee -a "$GITHUB_OUTPUT"

  # vet and tests, gating the release
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/.vendor/cache
          key: web-vendor-${{ hashFiles('web/vendor.lock') }}
      # every package cross-vetted too: macOS and Windows hosts run the same roles
      - run: go generate ./internal/web && go vet ./... && go test ./... && GOOS=darwin go vet ./... && GOOS=windows go vet ./...
      # the shipped license texts current with every dependency and pinned tool
      - name: licenses
        run: |
          go run ./cmd/licenses
          git diff --exit-code THIRD_PARTY_LICENSES.txt || { echo "THIRD_PARTY_LICENSES.txt is stale, run make licenses and commit it" >&2; exit 1; }

  # one job per OS: Linux's host the .deb around the Go binary
  # alone (no Rust or webkit), macOS's and Windows' one tray app around it
  build:
    needs: [version]
    if: ${{ inputs.linux_amd64 || inputs.linux_arm64 || inputs.macos || inputs.windows }}
    strategy:
      # one OS's failure leaves the others' builds, and their caches, finished
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    env:
      VER: ${{ needs.version.outputs.ver }}
      APP: packaging/host
      APP_TAURI: ${{ !startsWith(matrix.name, 'linux') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: rust
        if: env.APP_TAURI == 'true'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          [ "${{ matrix.name }}" != macos-universal ] || rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.APP_TAURI == 'true'
        with:
          workspaces: packaging/host
          prefix-key: v2-host
          key: ${{ matrix.name }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        if: env.APP_TAURI == 'true'
        with:
          tool: tauri-cli@2.12.3
      # apt key's public half, into the host package
      - name: apt key
        if: startsWith(matrix.name, 'linux')
        env:
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          export GNUPGHOME=$(mktemp -d)
          echo "$KEY" | gpg --batch --import
          gpg --export > "$RUNNER_TEMP/phosphorus.gpg"
          echo "PHOSPHORUS_APT_KEY=$RUNNER_TEMP/phosphorus.gpg" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/.vendor/cache
          key: web-vendor-${{ hashFiles('web/vendor.lock') }}
      # the web client built into internal/web/dist before any binary embeds it,
      # a binary without it serving nothing but 404s
      - name: web
        shell: bash
        run: go generate ./internal/web && test -f internal/web/dist/index.html
      # the release's tree (.github and packaging export-ignored), its bundled tools
      # and the host binary, Linux's packaged at once, macOS's and Windows' the host app's sidecar;
      # the tools fetched beside the Go builds
      - name: host binary
        shell: bash
        run: |
          mkdir -p out upd art $APP/payload $APP/binaries
          git archive HEAD | tar -x -C $APP/payload && echo "$VER" > $APP/payload/VERSION
          cp THIRD_PARTY_LICENSES.txt out/
          b() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" -o "$3" ./cmd/phosphorus; }
          case "${{ matrix.name }}" in
            linux-*)
              packaging/tools.sh linux ${{ matrix.arch }} art/tools > art/tools.log 2>&1 & t=$!
              # forgejo's corresponding source beside the package carrying its binary
              packaging/tools.sh source any out > art/src.log 2>&1 & s=$!
              b linux ${{ matrix.arch }} art/phosphorus
              wait $t || { cat art/tools.log; exit 1; }
              wait $s || { cat art/src.log; exit 1; }
              packaging/deb/build.sh "out/phosphorus_${VER}_${{ matrix.arch }}.deb" "$VER" $APP/payload ${{ matrix.arch }} art/phosphorus art/tools ;;
            macos-universal)
              packaging/tools.sh darwin universal $APP/payload/tools > art/tools.log 2>&1 & t=$!
              b darwin arm64 art/h-arm64 & a=$!
              b darwin amd64 art/h-amd64
              wait $a && wait $t || { cat art/tools.log; exit 1; }
              lipo -create -output $APP/binaries/phosphorus-host-universal-apple-darwin art/h-arm64 art/h-amd64
              # per-arch sidecars for the per-arch cargo builds of the universal target
              mv art/h-arm64 $APP/binaries/phosphorus-host-aarch64-apple-darwin
              mv art/h-amd64 $APP/binaries/phosphorus-host-x86_64-apple-darwin ;;
            windows-*)
              packaging/tools.sh windows amd64 $APP/payload/tools > art/tools.log 2>&1 & t=$!
              b windows amd64 $APP/binaries/phosphorus-host-x86_64-pc-windows-msvc.exe
              wait $t || { cat art/tools.log; exit 1; } ;;
          esac
      # updater config and artifacts only with a signing key
      - name: host app
        if: env.APP_TAURI == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUB: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PUB" ]; then
            CFG="{\"version\":\"$VER.0\",\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$PUB\",\"endpoints\":[\"https://github.com/${{ github.repository }}/releases/download/update/{{target}}-{{arch}}.json\"],\"windows\":{\"installMode\":\"passive\"}}}}"
          else
            CFG="{\"version\":\"$VER.0\"}"
          fi
          cd $APP
          cargo tauri build ${{ matrix.args }} --config "$CFG"
          o=../../out u=../../upd
          if [ "${{ matrix.name }}" = macos-universal ]; then
            d=target/universal-apple-darwin/release/bundle
            cp $d/dmg/*.dmg "$o/phosphorus-$VER-macos-universal.dmg"
            t=$d/macos/Phosphorus.app.tar.gz
            [ -e "$t.sig" ] && cp "$t" $u/phosphorus-macos-universal.app.tar.gz && cp "$t.sig" $u/phosphorus-macos-universal.app.tar.gz.sig
          else
            for f in target/release/bundle/nsis/*-setup.exe; do
              cp "$f" "$o/phosphorus-$VER-windows-x86_64-setup.exe"
              [ -e "$f.sig" ] && cp "$f" $u/phosphorus-windows-x86_64-setup.exe && cp "$f.sig" $u/phosphorus-windows-x86_64-setup.exe.sig
            done
          fi
          # stale bundles out of the saved rust cache
          rm -rf target/*/release/bundle target/release/bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: out-${{ matrix.name }}
          path: out/
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upd-${{ matrix.name }}
          path: upd/
          compression-level: 0
          if-no-files-found: ignore

  release:
    needs: [version, check, build]
    # runs with unchecked OSes skipped, not when anything failed
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: out
          pattern: out-*
          merge-multiple: true
      # GitHub lists a release's assets flat: the notes group them, each linked
      - name: notes
        env:
          REPO: ${{ github.repository }}
        run: |
          cd out
          U=https://github.com/$REPO/releases/download/v$VER
          # one table row per OS: its label, then each built file as a short link
          row() { local os=$1 out=""; shift; for f in "$@"; do [ -e "$f" ] || continue; local l=${f##*.}; case $f in *amd64*) l="amd64 .$l";; *arm64*) l="arm64 .$l";; *) l=".$l";; esac; out+="${out:+ · }[$l]($U/$f)"; done; [ -n "$out" ] && echo "| $os | $out |"; true; }
          table() { local rows; rows=$(row macOS $1-macos-universal.dmg; row Windows $1-windows-x86_64-setup.exe; row Linux $2_amd64.deb $2_arm64.deb); [ -n "$rows" ] && printf '## %s\n\n| | |\n|---|---|\n%s\n\n' "$3" "$rows"; true; }
          {
            shopt -s nullglob
            table phosphorus-$VER phosphorus_$VER Phosphorus
            echo "## Misc"
            echo
            m=""
            [ -e THIRD_PARTY_LICENSES.txt ] && m="[Licenses]($U/THIRD_PARTY_LICENSES.txt)"
            for f in forgejo-src-*.tar.gz; do m+="${m:+ · }[Forgejo source]($U/$f)"; done
            echo "$m"
            echo
            echo "Install steps: [README](https://github.com/$REPO#quick-start)"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VER }}
          name: Phosphorus ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: out/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: upd
          pattern: upd-*
          merge-multiple: true
      # built OSes' files onto `update`; others: last release's
      - name: update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          mkdir -p upd && cd upd
          BASE=https://github.com/$GH_REPO/releases/download/update
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"%s","pub_date":"%s","notes":"https://github.com/%s/releases/tag/v%s"}\n' "$VER" "$NOW" "$GH_REPO" "$VER" > latest.json
          feed() { printf '{"version":"%s.0","pub_date":"%s","url":"%s/%s","signature":"%s","notes":""}\n' "$VER" "$NOW" "$BASE" "$2" "$(cat "$2.sig")" > "$1.json"; }
          if [ -e phosphorus-macos-universal.app.tar.gz ]; then
            feed darwin-x86_64 phosphorus-macos-universal.app.tar.gz
            feed darwin-aarch64 phosphorus-macos-universal.app.tar.gz
          fi
          if [ -e phosphorus-windows-x86_64-setup.exe ]; then feed windows-x86_64 phosphorus-windows-x86_64-setup.exe; fi
          # Linux hosts update over apt
          # the apt feed: the host packages alone
          if [ -n "$KEY" ] && ls ../out/phosphorus_*.deb >/dev/null 2>&1; then
            command -v apt-ftparchive >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q apt-utils; }
            # the unchecked arch's index kept from the last release
            gh release download update -p 'Packages-*' || true
            for f in ../out/phosphorus_*.deb; do
              d=${f##*_}; d=${d%.deb} n=${f##*/}; n=${n%%_*}
              mkdir -p "a-$d" && cp "$f" "a-$d/${n}_$d.deb"
              (cd "a-$d" && apt-ftparchive packages .) > "Packages-$d"
              mv "a-$d/${n}_$d.deb" . && rmdir "a-$d"
            done
            cat Packages-* > Packages
            # agents' apt-get allows the Origin and Label change
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Phosphorus -o APT::FTPArchive::Release::Label=Phosphorus release . > "$RUNNER_TEMP/Release"
            export GNUPGHOME=$(mktemp -d)
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --clearsign -o InRelease "$RUNNER_TEMP/Release"
          fi
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title "Update feed" --notes "Files installed hosts update from. Install from the numbered releases."
          gh release upload update * --clobber

  # only the two newest numbered releases and their tags kept, the `update` feed
  # aside; only this workflow's two newest runs, this one included
  prune:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: releases
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do
            echo "deleting release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
      - name: runs
        run: |
          gh run list --workflow release.yml --limit 200 --json databaseId,createdAt,status --jq 'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            echo "deleting run $id"
            gh run delete "$id" || true
          done
