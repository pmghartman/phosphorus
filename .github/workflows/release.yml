# manual release: per checked OS a client-only and a host installer (.deb, .dmg,
# setup .exe) as vVERSION, feeds on release `update`, then only the two newest
# releases and runs kept
# app and apt feeds need TAURI_SIGNING_PRIVATE_KEY(_PASSWORD), APT_GPG_KEY, var TAURI_UPDATER_PUBKEY
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false
      linux_amd64:
        description: "Linux amd64"
        type: boolean
        default: false
      linux_arm64:
        description: "Linux arm64"
        type: boolean
        default: false
      macos:
        description: "MacOS"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@v7
      # every run one past the highest vMAJOR.MINOR tag: minor, or major with .0
      - name: next version
        id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
      - name: plan
        id: plan
        env:
          AMD64: ${{ inputs.linux_amd64 }}
          ARM64: ${{ inputs.linux_arm64 }}
          MAC: ${{ inputs.macos }}
          WIN: ${{ inputs.windows }}
        run: |
          on() { for v in "$@"; do [ "$v" = true ] && return 0; done; return 1; }
          on "$AMD64" "$ARM64" "$MAC" "$WIN" || { echo "check at least one OS" >&2; exit 1; }
          builds=()
          [ "$AMD64" = true ] && builds+=('{"name":"linux-amd64","runner":"ubuntu-24.04","arch":"amd64","args":"--bundles deb"}')
          [ "$ARM64" = true ] && builds+=('{"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64","args":"--bundles deb"}')
          [ "$MAC" = true ] && builds+=('{"name":"macos-universal","runner":"macos-14","arch":"universal","args":"--target universal-apple-darwin --bundles app,dmg"}')
          [ "$WIN" = true ] && builds+=('{"name":"windows-x86_64","runner":"windows-2022","arch":"amd64","args":"--bundles nsis"}')
          j() { local IFS=,; echo "[$*]"; }
          echo "builds=$(j "${builds[@]}")" | tee -a "$GITHUB_OUTPUT"

  # vet and tests, gating the release
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: web/.vendor/cache
          key: web-vendor-${{ hashFiles('web/vendor.lock') }}
      # every package cross-vetted too: macOS and Windows hosts run the same roles
      - run: go generate ./internal/web && go vet ./... && go test ./... && GOOS=darwin go vet ./... && GOOS=windows go vet ./...

  # one job per OS: the host binary built once, the client installer every host
  # installer builds on bundled first, the host one after off the same Rust build
  # (only the app crate relinked); Linux's host the .deb around the binary alone
  build:
    needs: [version]
    strategy:
      # one OS's failure leaves the others' builds, and their caches, finished
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    env:
      VER: ${{ needs.version.outputs.ver }}
      APP: packaging/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: webkit
        if: startsWith(matrix.name, 'linux')
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: mac targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/app
          key: ${{ matrix.name }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      # apt key's public half, into the host package
      - name: apt key
        if: startsWith(matrix.name, 'linux')
        env:
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          export GNUPGHOME=$(mktemp -d)
          echo "$KEY" | gpg --batch --import
          gpg --export > "$RUNNER_TEMP/phosphorus.gpg"
          echo "PHOSPHORUS_APT_KEY=$RUNNER_TEMP/phosphorus.gpg" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: web/.vendor/cache
          key: web-vendor-${{ hashFiles('web/vendor.lock') }}
      # the web client built into internal/web/dist before any binary embeds it,
      # a binary without it serving nothing but 404s
      - name: web
        shell: bash
        run: go generate ./internal/web && test -f internal/web/dist/index.html
      # the release's tree (.github and packaging export-ignored), its bundled tools
      # and the host binary, Linux's packaged at once, macOS's and Windows' the host app's sidecar
      - name: host binary
        shell: bash
        run: |
          mkdir -p out upd art $APP/payload $APP/binaries
          git archive HEAD | tar -x -C $APP/payload && echo "$VER" > $APP/payload/VERSION
          b() { test -f internal/web/dist/index.html && CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" -o "$3" ./cmd/phosphorus; }
          case "${{ matrix.name }}" in
            linux-*)
              b linux ${{ matrix.arch }} art/phosphorus
              packaging/tools.sh linux ${{ matrix.arch }} art/tools
              packaging/deb/build.sh "out/phosphorus_${VER}_${{ matrix.arch }}.deb" "$VER" $APP/payload ${{ matrix.arch }} art/phosphorus art/tools ;;
            macos-universal)
              b darwin arm64 art/h-arm64 && b darwin amd64 art/h-amd64
              lipo -create -output $APP/binaries/phosphorus-host-universal-apple-darwin art/h-arm64 art/h-amd64
              # per-arch sidecars for the per-arch cargo builds of the universal target
              cp art/h-arm64 $APP/binaries/phosphorus-host-aarch64-apple-darwin
              cp art/h-amd64 $APP/binaries/phosphorus-host-x86_64-apple-darwin
              packaging/tools.sh darwin universal $APP/payload/tools ;;
            windows-*)
              b windows amd64 $APP/binaries/phosphorus-host-x86_64-pc-windows-msvc.exe
              packaging/tools.sh windows amd64 $APP/payload/tools ;;
          esac
      # updater config and artifacts only with a signing key, Linux's client a plain .deb
      - name: app config
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUB: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          cfg() { echo "{\"version\":\"$VER.0\"}"; }
          upd() { echo "{\"version\":\"$VER.0\",\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$PUB\",\"endpoints\":[\"https://github.com/${{ github.repository }}/releases/download/update/$1{{target}}-{{arch}}.json\"],\"windows\":{\"installMode\":\"passive\"}}}}"; }
          if [ -n "$KEY" ] && [ -n "$PUB" ] && [[ "${{ matrix.name }}" != linux-* ]]; then
            { echo "CLIENT_CFG=$(upd client-)"; echo "HOST_CFG=$(upd '')"; } >> "$GITHUB_ENV"
          else
            { echo "CLIENT_CFG=$(cfg)"; echo "HOST_CFG=$(cfg)"; } >> "$GITHUB_ENV"
          fi
      - name: client
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd $APP
          cargo tauri build ${{ matrix.args }} --config "$CLIENT_CFG"
          o=../../out u=../../upd
          case "${{ matrix.name }}" in
            linux-*)
              cp target/release/bundle/deb/*.deb "$o/phosphorus-client_${VER}_${{ matrix.arch }}.deb" ;;
            macos-universal)
              d=target/universal-apple-darwin/release/bundle
              cp $d/dmg/*.dmg "$o/phosphorus-client-$VER-macos-universal.dmg"
              t="$d/macos/Phosphorus Client.app.tar.gz"
              [ -e "$t.sig" ] && cp "$t" $u/phosphorus-client-macos-universal.app.tar.gz && cp "$t.sig" $u/phosphorus-client-macos-universal.app.tar.gz.sig
              # into the host app, its window opened by the tray
              mkdir -p client && cp -R "$d/macos/Phosphorus Client.app" client/
              rm -rf $d ;;
            windows-*)
              d=target/release/bundle/nsis
              for f in $d/*-setup.exe; do
                cp "$f" "$o/phosphorus-client-$VER-windows-x86_64-setup.exe"
                [ -e "$f.sig" ] && cp "$f" $u/phosphorus-client-windows-x86_64-setup.exe && cp "$f.sig" $u/phosphorus-client-windows-x86_64-setup.exe.sig
              done
              mkdir -p client && cp target/release/Phosphorus.exe "client/Phosphorus Client.exe"
              rm -rf $d ;;
          esac
      - name: host app
        if: ${{ !startsWith(matrix.name, 'linux') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd $APP
          cargo tauri build ${{ matrix.args }} --config tauri.host.conf.json --config "$HOST_CFG"
          o=../../out u=../../upd
          if [ "${{ matrix.name }}" = macos-universal ]; then
            d=target/universal-apple-darwin/release/bundle
            cp $d/dmg/*.dmg "$o/phosphorus-$VER-macos-universal.dmg"
            t=$d/macos/Phosphorus.app.tar.gz
            [ -e "$t.sig" ] && cp "$t" $u/phosphorus-macos-universal.app.tar.gz && cp "$t.sig" $u/phosphorus-macos-universal.app.tar.gz.sig
          else
            for f in target/release/bundle/nsis/*-setup.exe; do
              cp "$f" "$o/phosphorus-$VER-windows-x86_64-setup.exe"
              [ -e "$f.sig" ] && cp "$f" $u/phosphorus-windows-x86_64-setup.exe && cp "$f.sig" $u/phosphorus-windows-x86_64-setup.exe.sig
            done
          fi
          true
      - uses: actions/upload-artifact@v7
        with:
          name: out-${{ matrix.name }}
          path: out/
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: upd-${{ matrix.name }}
          path: upd/
          compression-level: 0
          if-no-files-found: ignore

  release:
    needs: [version, check, build]
    # runs with unchecked OSes skipped, not when anything failed
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: out-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VER }}
          name: Phosphorus ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body: |
            Each OS has a client-only installer (`phosphorus-client`), a window on the mesh's frontend, and a host installer (`phosphorus`), which runs this machine as a host and includes the client.
            ${{ inputs.macos && '**MacOS**: open the `.dmg`, drag the app to Applications and open it (first open: right-click > Open). The host app asks for its keys and needs the Tailscale app.' || '' }}
            ${{ inputs.windows && '**Windows**: run the setup `.exe` (SmartScreen: More info > Run anyway). The host app asks for its keys and needs Tailscale for Windows.' || '' }}
            ${{ (inputs.linux_amd64 || inputs.linux_arm64) && format('**Linux**: client `sudo apt install ./phosphorus-client_{0}_ARCH.deb`; host `sudo apt install ./phosphorus_{0}_ARCH.deb`, then `sudo phosphorus` and paste the keys it asks for (`amd64` or `arm64`).', env.VER) || '' }}
          files: out/*
      - uses: actions/download-artifact@v8
        with:
          path: upd
          pattern: upd-*
          merge-multiple: true
      # built OSes' files onto `update`; others: last release's
      - name: update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          mkdir -p upd && cd upd
          BASE=https://github.com/$GH_REPO/releases/download/update
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"%s","pub_date":"%s","notes":"https://github.com/%s/releases/tag/v%s"}\n' "$VER" "$NOW" "$GH_REPO" "$VER" > latest.json
          feed() { printf '{"version":"%s.0","pub_date":"%s","url":"%s/%s","signature":"%s","notes":""}\n' "$VER" "$NOW" "$BASE" "$2" "$(cat "$2.sig")" > "$1.json"; }
          for p in "" client-; do
            if [ -e phosphorus-${p}macos-universal.app.tar.gz ]; then
              f=phosphorus-${p}macos-universal.app.tar.gz
              feed ${p}darwin-x86_64 $f
              feed ${p}darwin-aarch64 $f
            fi
            if [ -e phosphorus-${p}windows-x86_64-setup.exe ]; then feed ${p}windows-x86_64 phosphorus-${p}windows-x86_64-setup.exe; fi
          done
          # the apt feed: the host packages alone
          if [ -n "$KEY" ] && ls ../out/phosphorus_*.deb >/dev/null 2>&1; then
            command -v apt-ftparchive >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q apt-utils; }
            # the unchecked arch's index kept from the last release
            gh release download update -p 'Packages-*' || true
            for f in ../out/phosphorus_*.deb; do
              d=${f##*_}; d=${d%.deb} n=${f##*/}; n=${n%%_*}
              mkdir -p "a-$d" && cp "$f" "a-$d/${n}_$d.deb"
              (cd "a-$d" && apt-ftparchive packages .) > "Packages-$d"
              mv "a-$d/${n}_$d.deb" . && rmdir "a-$d"
            done
            cat Packages-* > Packages
            # agents' apt-get allows the Origin and Label change
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Phosphorus -o APT::FTPArchive::Release::Label=Phosphorus release . > "$RUNNER_TEMP/Release"
            export GNUPGHOME=$(mktemp -d)
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --clearsign -o InRelease "$RUNNER_TEMP/Release"
          fi
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title "Update feed" --notes "Files installed hosts and clients update from. Install from the numbered releases."
          gh release upload update * --clobber

  # only the two newest numbered releases and their tags kept, the `update` feed
  # aside; only this workflow's two newest runs, this one included
  prune:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: releases
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do
            echo "deleting release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
      - name: runs
        run: |
          gh run list --workflow release.yml --limit 200 --json databaseId,createdAt,status --jq 'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            echo "deleting run $id"
            gh run delete "$id" || true
          done
