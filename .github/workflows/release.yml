# manual release: ghcr images, .deb, .dmg, setup .exe as vVERSION, feed on release `update`
# app and apt feeds need TAURI_SIGNING_PRIVATE_KEY(_PASSWORD), APT_GPG_KEY, var TAURI_UPDATER_PUBKEY
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump the major version (minor otherwise)"
        type: boolean
        default: false
      linux_amd64:
        description: "Linux amd64 (.deb, images)"
        type: boolean
        default: true
      linux_arm64:
        description: "Linux arm64 (.deb, images)"
        type: boolean
        default: true
      macos:
        description: "macOS (.dmg)"
        type: boolean
        default: true
      windows:
        description: "Windows (setup .exe)"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      apps: ${{ steps.plan.outputs.apps }}
      arches: ${{ steps.plan.outputs.arches }}
      debs: ${{ steps.plan.outputs.debs }}
    steps:
      - uses: actions/checkout@v7
      # every run one past the highest vMAJOR.MINOR tag: minor, or major with .0
      - name: next version
        id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
      - name: plan
        id: plan
        env:
          AMD64: ${{ inputs.linux_amd64 }}
          ARM64: ${{ inputs.linux_arm64 }}
          MAC: ${{ inputs.macos }}
          WIN: ${{ inputs.windows }}
        run: |
          on() { for v in "$@"; do [ "$v" = true ] && return 0; done; return 1; }
          on "$AMD64" "$ARM64" "$MAC" "$WIN" || { echo "check at least one target" >&2; exit 1; }
          apps=() arches=() debs=()
          # image arches every checked target's hosts pull: macs on either, windows amd64
          on "$AMD64" "$MAC" "$WIN" && arches+=('{"arch":"amd64","runner":"ubuntu-24.04"}')
          on "$ARM64" "$MAC" && arches+=('{"arch":"arm64","runner":"ubuntu-24.04-arm"}')
          on "$AMD64" && debs+=('"amd64"')
          on "$ARM64" && debs+=('"arm64"')
          [ "$MAC" = true ] && apps+=('{"os":"macos-14","name":"macos-universal","args":"--target universal-apple-darwin --bundles app,dmg"}')
          [ "$WIN" = true ] && apps+=('{"os":"windows-2022","name":"windows-x86_64","args":"--bundles nsis"}')
          j() { local IFS=,; echo "[$*]"; }
          { echo "apps=$(j "${apps[@]}")"; echo "arches=$(j "${arches[@]}")"; echo "debs=$(j "${debs[@]}")"; } | tee -a "$GITHUB_OUTPUT"

  # vet and tests, gating the release
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: web/.vendor/cache
          key: web-vendor-${{ hashFiles('web/vendor.lock') }}
      # the host side cross-built too: macOS and Windows ship it in the app
      - run: go generate ./internal/web && go vet ./... && go test ./... && GOOS=darwin go vet ./cmd/... ./internal/host && GOOS=windows go vet ./cmd/... ./internal/host

  # every image of one arch on its native runner in one bake, pushed by
  # digest, joined into one tag per image by `manifests`
  images:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.arches) }}
    runs-on: ${{ matrix.runner }}
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: bake
        uses: docker/bake-action@v6
        env:
          ARCH: ${{ matrix.arch }}
        with:
          source: .
          files: container/docker-bake.hcl
      - name: digests
        env:
          META: ${{ steps.bake.outputs.metadata }}
        run: |
          for t in phosphorus model git; do
            n=phosphorus; [ $t = phosphorus ] || n=phosphorus-$t
            d=$(jq -r --arg t $t '.[$t]["containerimage.digest"]' <<<"$META")
            mkdir -p d/$n && touch "d/$n/${d#sha256:}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: digests_${{ matrix.arch }}
          path: d/

  manifests:
    needs: [version, images]
    runs-on: ubuntu-24.04
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: d
          pattern: digests_*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: tag
        run: |
          for n in phosphorus phosphorus-model phosphorus-git; do
            img="$REGISTRY/$n"
            docker buildx imagetools create -t "$img:$VER" $(cd "d/$n" && printf "$img@sha256:%s " *)
          done

  deb:
    needs: [version]
    if: needs.version.outputs.debs != '[]'
    runs-on: ubuntu-24.04
    env:
      VER: ${{ needs.version.outputs.ver }}
      ARCHES: ${{ join(fromJSON(needs.version.outputs.debs), ' ') }}
    steps:
      - uses: actions/checkout@v7
      # apt key's public half, into the package
      - name: apt key
        env:
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          export GNUPGHOME=$(mktemp -d)
          echo "$KEY" | gpg --batch --import
          gpg --export > "$RUNNER_TEMP/phosphorus.gpg"
          echo "PHOSPHORUS_APT_KEY=$RUNNER_TEMP/phosphorus.gpg" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build .deb
        run: |
          mkdir -p art/payload out
          # the release's tree, .github and packaging export-ignored
          git archive HEAD | tar -x -C art/payload && echo "$VER" > art/payload/VERSION
          for a in $ARCHES; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w" -o "art/phosphorus-$a" ./cmd/phosphorus
            packaging/deb/build.sh "out/phosphorus_${VER}_$a.deb" "$VER" art/payload "$a" "art/phosphorus-$a"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: out/
          compression-level: 0

  # tray app: universal .dmg, Windows setup .exe, the release's tree and host binary inside
  app:
    needs: [version]
    if: needs.version.outputs.apps != '[]'
    strategy:
      # one platform's failure leaves the other's build, and its cache, finished
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.apps) }}
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/checkout@v7
      - name: rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: mac targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/app
          key: ${{ matrix.name }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # the release's tree as resources, the host binary as the app's sidecar
      - name: resources
        shell: bash
        run: |
          mkdir -p packaging/app/payload packaging/app/binaries
          git archive HEAD | tar -x -C packaging/app/payload && echo "$VER" > packaging/app/payload/VERSION
          b() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" -o "$3" ./cmd/phosphorus; }
          if [ "${{ matrix.name }}" = macos-universal ]; then
            b darwin arm64 h-arm64 && b darwin amd64 h-amd64
            lipo -create -output packaging/app/binaries/phosphorus-host-universal-apple-darwin h-arm64 h-amd64
          else
            b windows amd64 packaging/app/binaries/phosphorus-host-x86_64-pc-windows-msvc.exe
          fi
      # updater config and artifacts only with a signing key
      - name: app config
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUB: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          C="{\"version\":\"$VER.0\"}"
          if [ -n "$KEY" ] && [ -n "$PUB" ]; then
            U="https://github.com/${{ github.repository }}/releases/download/update/{{target}}-{{arch}}.json"
            C="{\"version\":\"$VER.0\",\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$PUB\",\"endpoints\":[\"$U\"],\"windows\":{\"installMode\":\"passive\"}}}}"
          fi
          echo "CFG=$C" >> "$GITHUB_ENV"
      - name: build app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd packaging/app
          cargo tauri build ${{ matrix.args }} --config "$CFG"
          mkdir -p ../../out ../../upd
          if [ "${{ matrix.name }}" = macos-universal ]; then
            cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "../../out/phosphorus-$VER-macos-universal.dmg"
            u=target/universal-apple-darwin/release/bundle/macos/Phosphorus.app.tar.gz
            [ -e "$u.sig" ] && cp "$u" ../../upd/phosphorus-macos-universal.app.tar.gz && cp "$u.sig" ../../upd/phosphorus-macos-universal.app.tar.gz.sig
          else
            cp target/release/bundle/nsis/*-setup.exe "../../out/phosphorus-$VER-windows-x86_64-setup.exe"
            for u in target/release/bundle/nsis/*-setup.exe; do
              [ -e "$u.sig" ] && cp "$u" ../../upd/phosphorus-windows-x86_64-setup.exe && cp "$u.sig" ../../upd/phosphorus-windows-x86_64-setup.exe.sig
            done
          fi
          true
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: out/
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: upd-${{ matrix.name }}
          path: upd/
          compression-level: 0
          if-no-files-found: ignore

  release:
    needs: [version, check, manifests, deb, app]
    # runs with unchecked targets skipped, not when anything failed
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: "{app-*,deb}"
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VER }}
          name: Phosphorus ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ inputs.macos && '**macOS**: open the `.dmg`, drag Phosphorus to Applications, open it (first open: right-click > Open) and paste the keys it asks for. Needs colima and docker (see README).' || '' }}
            ${{ inputs.windows && '**Windows**: run the setup `.exe` (SmartScreen: More info > Run anyway) and paste the keys it asks for. Needs Docker Desktop.' || '' }}
            ${{ (inputs.linux_amd64 || inputs.linux_arm64) && format('**Linux**: `sudo apt install ./phosphorus_{0}_ARCH.deb` (`amd64` or `arm64`), then `sudo phosphorus` and paste the keys it asks for.', env.VER) || '' }}
          files: out/*
      - uses: actions/download-artifact@v8
        with:
          path: upd
          pattern: upd-*
          merge-multiple: true
      # built targets' files onto `update`; others: last release's
      - name: update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          mkdir -p upd && cd upd
          BASE=https://github.com/$GH_REPO/releases/download/update
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"%s","pub_date":"%s","notes":"https://github.com/%s/releases/tag/v%s"}\n' "$VER" "$NOW" "$GH_REPO" "$VER" > latest.json
          feed() { printf '{"version":"%s.0","pub_date":"%s","url":"%s/%s","signature":"%s","notes":""}\n' "$VER" "$NOW" "$BASE" "$2" "$(cat "$2.sig")" > "$1.json"; }
          if [ -e phosphorus-macos-universal.app.tar.gz ]; then
            feed darwin-x86_64 phosphorus-macos-universal.app.tar.gz
            feed darwin-aarch64 phosphorus-macos-universal.app.tar.gz
          fi
          [ -e phosphorus-windows-x86_64-setup.exe ] && feed windows-x86_64 phosphorus-windows-x86_64-setup.exe
          if [ -n "$KEY" ] && ls ../out/*.deb >/dev/null 2>&1; then
            command -v apt-ftparchive >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q apt-utils; }
            # the unchecked arch's index kept from the last release
            gh release download update -p 'Packages-*' || true
            for f in ../out/*.deb; do
              d=${f##*_}; d=${d%.deb} n=${f##*/}; n=${n%%_*}
              mkdir -p "a-$d" && cp "$f" "a-$d/${n}_$d.deb"
              (cd "a-$d" && apt-ftparchive packages .) > "Packages-$d"
              mv "a-$d/${n}_$d.deb" . && rmdir "a-$d"
            done
            cat Packages-* > Packages
            # agents' apt-get allows the Origin and Label change
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Phosphorus -o APT::FTPArchive::Release::Label=Phosphorus release . > "$RUNNER_TEMP/Release"
            export GNUPGHOME=$(mktemp -d)
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --clearsign -o InRelease "$RUNNER_TEMP/Release"
          fi
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title "Update feed" --notes "Files installed hosts update from. Install from the numbered releases."
          gh release upload update * --clobber
