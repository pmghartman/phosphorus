# manual release: per checked OS a host installer (.deb, .dmg, setup .exe), as
# vVERSION, one past the highest tag; feeds on release `update` for the hosts built,
# then only the two newest releases and runs kept
# app and apt feeds need UPDATE_SIGNING_KEY (bun scripts/feedsign.ts -keygen), APT_GPG_KEY, var UPDATE_PUBKEY;
# Windows' code signing vars AZURE_SIGNING_ENDPOINT/ACCOUNT/PROFILE and secrets AZURE_TENANT_ID/
# CLIENT_ID/CLIENT_SECRET (Trusted Signing), or secrets WINDOWS_CERT_PFX/PASSWORD (packaging/winsign.sh)
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false
      linux_amd64:
        description: "Linux amd64"
        type: boolean
        default: false
      linux_arm64:
        description: "Linux arm64"
        type: boolean
        default: false
      macos:
        description: "MacOS"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: false

permissions:
  contents: read

# one release at a time: the next version is read off the tags
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # the version, the plan, the notices and the web client, once, for every job after
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      builds: ${{ steps.plan.outputs.builds }}
      # the lockfile's hash: the bun cache's key, and what prune keeps
      lock: ${{ steps.lock.outputs.lock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: lock
        run: echo "lock=${{ hashFiles('bun.lock') }}" | tee -a "$GITHUB_OUTPUT"
      # every run one past the highest vMAJOR.MINOR tag: minor, or major with .0
      - name: next version
        id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
      - name: plan
        id: plan
        env:
          AMD64: ${{ inputs.linux_amd64 }}
          ARM64: ${{ inputs.linux_arm64 }}
          MAC: ${{ inputs.macos }}
          WIN: ${{ inputs.windows }}
        run: |
          builds=()
          [ "$AMD64" = true ] && builds+=('{"name":"linux-amd64","runner":"ubuntu-24.04","arch":"amd64"}')
          [ "$ARM64" = true ] && builds+=('{"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}')
          [ "$MAC" = true ] && builds+=('{"name":"macos","runner":"macos-14","arch":"arm64"}')
          [ "$WIN" = true ] && builds+=('{"name":"windows-x86_64","runner":"ubuntu-24.04","arch":"amd64"}')
          [ ${#builds[@]} -gt 0 ] || { echo "::error::check at least one OS"; exit 1; }
          echo "builds=[$(IFS=,; echo "${builds[*]}")]" | tee -a "$GITHUB_OUTPUT"
      # the notices and web client need no dev tools
      - uses: ./.github/actions/bun
        with:
          production: "true"
      # every production dependency under an allowed license, the notices and SBOM
      # shipped in each installer; first, so the page's copy (about links it) is this release's
      - run: bun scripts/licenses.ts notices
      # a binary without it serves nothing but 404s
      - run: bun run web && test -f packages/server/webstatic/dist/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: |
            packages/server/webstatic/dist/
            packages/server/webstatic/src/manifest.ts
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notices
          path: notices/
          retention-days: 1

  # types, the formatter and tests on prep's build, at once, beside the builds: only
  # the publishing waits on it
  check:
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun
      # tsc reads its manifest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: packages/server/webstatic
      - name: check, lint, test
        run: |
          bun run check > check.log 2>&1 & c=$!
          bun run lint > lint.log 2>&1 & l=$!
          ok=0
          bun run test || ok=1
          wait $c || { cat check.log; ok=1; }
          wait $l || { cat lint.log; ok=1; }
          exit $ok

  # one job per OS: Linux's host the .deb around the binary, macOS's and
  # Windows' the menu bar app beside it, in a .dmg and a setup .exe
  build:
    needs: prep
    strategy:
      # one OS's failure leaves the others' builds, and their caches, finished
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VER: ${{ needs.prep.outputs.ver }}
      APP: packaging/host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # the compile needs no dev tools (biome, tsc, resvg)
      - uses: ./.github/actions/bun
        with:
          production: "true"
      # apt key's public half, into the host package
      - name: apt key
        if: startsWith(matrix.name, 'linux')
        env:
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          export GNUPGHOME=$(mktemp -d)
          echo "$KEY" | gpg --batch --import
          gpg --export > "$RUNNER_TEMP/phosphorus.gpg"
          echo "PHOSPHORUS_APT_KEY=$RUNNER_TEMP/phosphorus.gpg" >> "$GITHUB_ENV"
      # the web client the web job built, into packages/server/webstatic before anything embeds it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: packages/server/webstatic
      # the notices and SBOM, shipped inside each installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notices
          path: notices
      # the release hosts receive: what the binary reads off disk, nothing it embeds;
      # tailscale and cloudflared fetched by each host at their pins; Linux's packaged at once
      - name: host binary
        shell: bash
        # the release key baked in, the one first-party apps' bundles are checked against
        env:
          FEED_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
        run: |
          mkdir -p out upd art $APP/payload
          echo "$VER" > $APP/payload/VERSION
          cp LICENSE notices/THIRD_PARTY_NOTICES.txt notices/phosphorus.cdx.json $APP/payload/
          case "${{ matrix.name }}" in
            linux-*)
              bun scripts/build.ts linux-$([ ${{ matrix.arch }} = amd64 ] && echo x64 || echo arm64) art "$VER"
              packaging/deb/build.sh "out/phosphorus_${VER}_${{ matrix.arch }}.deb" "$VER" $APP/payload ${{ matrix.arch }} art/phosphorus-host ;;
          esac
      # afterglow, phosphorus's fork of Apollo (github.com/pmghartman/afterglow), into the
      # release the setup carries: the host zip of the release whose tag the root
      # package.json pins @phosphorus/afterglow to, its checksum and build provenance
      # checked; each host's phos setup and rebuilds install it (packages/host/host/src/win/afterglow.ts)
      - name: afterglow
        if: startsWith(matrix.name, 'windows')
        env:
          GH_TOKEN: ${{ github.token }}
          AG_REPO: pmghartman/afterglow
        run: |
          AG=$(jq -r '.dependencies["@phosphorus/afterglow"]' package.json | sed -n 's|^github:.*#v\([0-9][0-9.]*\)$|\1|p')
          [ -n "$AG" ] || { echo "::error::@phosphorus/afterglow isn't pinned to a github:...#vX.Y release"; exit 1; }
          ZIP=afterglow-$AG-windows-x86_64.zip
          DL=$RUNNER_TEMP/afterglow
          gh release download "v$AG" -R "$AG_REPO" -p "$ZIP" -p SHA256SUMS -D "$DL"
          # SHA256SUMS lists the Linux tarball too, which isn't downloaded: only the zip's line checked
          (cd "$DL" && grep -E "[ *]$ZIP\$" SHA256SUMS | sha256sum -c --strict -)
          gh attestation verify "$DL/$ZIP" --repo "$AG_REPO"
          mkdir -p "$APP/payload/afterglow"
          unzip -q "$DL/$ZIP" -d "$APP/payload/afterglow"
          [ "$(cat "$APP/payload/afterglow/VERSION")" = "$AG" ] || { echo "::error::$ZIP isn't afterglow $AG"; exit 1; }
      # Windows' setup built on Linux: NSIS from apt, its signer osslsigncode or jsign
      - name: nsis
        if: startsWith(matrix.name, 'windows')
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nsis osslsigncode
      # the menu bar app around the host binary and release; its own update, signed
      # for the feed, only with the signing key
      - name: host app
        if: ${{ !startsWith(matrix.name, 'linux') }}
        shell: bash
        env:
          FEED_URL: https://github.com/${{ github.repository }}/releases/download/update
          FEED_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # Authenticode for the Windows .exes (packaging/winsign.sh): Trusted Signing's account
          # (vars) and the app registration it signs as (secrets), or a .pfx certificate
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          if [ "${{ matrix.name }}" = macos ]; then
            $APP/macos.sh "$VER" $APP/payload out upd
          else
            $APP/windows.sh "$VER" "$PWD/$APP/payload" "$PWD/out" "$PWD/upd"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: out-${{ matrix.name }}
          path: out/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upd-${{ matrix.name }}
          path: upd/
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

  release:
    needs: [prep, build, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VER: ${{ needs.prep.outputs.ver }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: out
          pattern: out-*
          merge-multiple: true
      # the SBOM beside the installers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notices
          path: notices
      - run: cp notices/phosphorus.cdx.json out/phosphorus-$VER.cdx.json
      # the notes: how to install, the assets listed by GitHub under them
      - name: notes
        run: |
          cd out
          {
            shopt -s nullglob
            # the install steps, each OS's only when built
            echo "You need a [Tailscale](https://tailscale.com) account and a reusable auth key."
            echo
            step() { echo "- $1"; }
            [ -e phosphorus-$VER-macos-arm64.dmg ] && step "**macOS:** open the \`.dmg\` (Apple silicon), drag Phosphorus to Applications, open it (first time: right-click, Open). It lives in the menu bar."
            [ -e phosphorus-$VER-windows-x86_64-setup.exe ] && step "**Windows:** run the setup \`.exe\` (SmartScreen: More info, Run anyway). It lives in the tray."
            ls phosphorus_${VER}_*.deb >/dev/null 2>&1 && step "**Linux:** \`sudo apt install ./phosphorus_${VER}_ARCH.deb\`, then \`sudo phosphorus\`."
            echo
            echo "Then enter the Tailscale auth key when asked; every other host copies the rest from the mesh. Open \`http://HOST\` from any device on the tailnet, by a host's name or tailnet IP. The first login is \`admin\` with your admin password."
            echo
            echo "Installed hosts update themselves: **Check for Updates** in the menu bar or tray, \`phos update\`, or the mesh update in the browser, every host at once."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VER }}
          name: Phosphorus ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: out/*

  # the update feed beside the release, not after it: nothing in it waits on the numbered
  # release's upload, and the upload nothing on it
  feed:
    needs: [prep, build, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VER: ${{ needs.prep.outputs.ver }}
    steps:
      # the tree first: a checkout cleans what's downloaded before it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # the app bundles need no dev tools
      - uses: ./.github/actions/bun
        with:
          production: "true"
      # the .debs alone, for the apt index
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: out
          pattern: out-linux-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: upd
          pattern: upd-*
          merge-multiple: true
      # the optional apps (optional/<id> with a page), each bundle and its feed
      # entry signed beside the host's
      - name: apps
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          APPS_FEED_BASE: https://github.com/${{ github.repository }}/releases/download/update
        run: |
          for d in optional/*/; do
            id=$(basename "$d")
            [ -f "$d/web/index.html" ] || continue
            bun run app "$id" upd "$VER"
          done
      # built OSes' files onto `update`; others: last release's
      - name: update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          mkdir -p upd && cd upd
          BASE=https://github.com/$GH_REPO/releases/download/update
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"%s","pub_date":"%s","notes":"https://github.com/%s/releases/tag/v%s"}\n' "$VER" "$NOW" "$GH_REPO" "$VER" > latest.json
          feed() { printf '{"version":"%s","url":"%s/%s","signature":"%s"}\n' "$VER" "$BASE" "$2" "$(cat "$2.sig")" > "$1.json"; }
          if [ -e phosphorus-macos-arm64.app.tar.gz ]; then
            feed darwin-aarch64 phosphorus-macos-arm64.app.tar.gz
          fi
          if [ -e phosphorus-windows-x86_64-setup.exe ]; then feed windows-x86_64 phosphorus-windows-x86_64-setup.exe; fi
          # Linux hosts update over apt
          # the apt feed: the host packages alone
          if [ -n "$KEY" ] && ls ../out/phosphorus_*.deb >/dev/null 2>&1; then
            command -v apt-ftparchive >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q apt-utils; }
            # the unchecked arch's index kept from the last release
            gh release download update -p 'Packages-*' || true
            for f in ../out/phosphorus_*.deb; do
              d=${f##*_}; d=${d%.deb} n=${f##*/}; n=${n%%_*}
              mkdir -p "a-$d" && cp "$f" "a-$d/${n}_$d.deb"
              (cd "a-$d" && apt-ftparchive packages .) > "Packages-$d"
              mv "a-$d/${n}_$d.deb" . && rmdir "a-$d"
            done
            cat Packages-* > Packages
            # agents' apt-get allows the Origin and Label change
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Phosphorus -o APT::FTPArchive::Release::Label=Phosphorus release . > "$RUNNER_TEMP/Release"
            export GNUPGHOME=$(mktemp -d)
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --clearsign -o InRelease "$RUNNER_TEMP/Release"
          fi
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title "Update feed" --notes "Files installed hosts update from. Install from the numbered releases."
          gh release upload update * --clobber

  # only the two newest numbered releases and their tags kept, the `update` feed
  # aside; only this workflow's two newest runs, this one included; of the bun
  # caches only this lockfile's
  prune:
    needs: [prep, release, feed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: releases
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do
            echo "deleting release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
      # the feed's app bundles of older versions, only this release's named by its entries
      - name: feed bundles
        env:
          VER: ${{ needs.prep.outputs.ver }}
        run: |
          gh release view update --json assets --jq '.assets[].name' |
          grep -E '^[a-z0-9-]+-[0-9]+\.[0-9]+\.tar\.gz$' | grep -vF -- "-$VER.tar.gz" |
          while read -r a; do
            echo "deleting feed asset $a"
            gh release delete-asset update "$a" --yes || true
          done
      - name: caches
        env:
          LOCK: ${{ needs.prep.outputs.lock }}
        run: |
          gh cache list --limit 200 --json id,key --jq ".[] | select(.key | startswith(\"bun-\")) | select(.key | endswith(\"-$LOCK\") | not) | .id" |
          while read -r id; do
            echo "deleting cache $id"
            gh cache delete "$id" || true
          done
      - name: runs
        run: |
          gh run list --workflow release.yml --limit 200 --json databaseId,createdAt,status --jq 'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            echo "deleting run $id"
            gh run delete "$id" || true
          done
