# manual release: per checked OS a host installer (.deb, .dmg, setup .exe), as
# vVERSION; feeds on release `update` for the hosts built, then only the two newest
# releases and runs kept
# app and apt feeds need UPDATE_SIGNING_KEY (bun scripts/feedsign.ts -keygen), APT_GPG_KEY, var UPDATE_PUBKEY;
# Windows' code signing vars AZURE_SIGNING_ENDPOINT/ACCOUNT/PROFILE and secrets AZURE_TENANT_ID/
# CLIENT_ID/CLIENT_SECRET (Trusted Signing), or secrets WINDOWS_CERT_PFX/PASSWORD (packaging/winsign.sh)
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false
      linux_amd64:
        description: "Linux amd64"
        type: boolean
        default: false
      linux_arm64:
        description: "Linux arm64"
        type: boolean
        default: false
      macos:
        description: "MacOS"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # bun's package cache in one place on every OS, kept between runs by actions/cache
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

# one release at a time: the next version is read off the tags
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      builds: ${{ steps.plan.outputs.builds }}
      # the lockfile's hash: the bun cache's key, and what prune keeps
      lock: ${{ steps.lock.outputs.lock }}
      # the pinned Forgejo version the release notes link the source of
      forgejo: ${{ steps.fj.outputs.forgejo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: fj
        run: echo "forgejo=$(sed -n 's/^FORGEJO=//p' packaging/tools.sh)" | tee -a "$GITHUB_OUTPUT"
      - id: lock
        run: echo "lock=${{ hashFiles('bun.lock') }}" | tee -a "$GITHUB_OUTPUT"
      # every run one past the highest vMAJOR.MINOR tag: minor, or major with .0
      - name: next version
        id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
      - name: plan
        id: plan
        env:
          AMD64: ${{ inputs.linux_amd64 }}
          ARM64: ${{ inputs.linux_arm64 }}
          MAC: ${{ inputs.macos }}
          WIN: ${{ inputs.windows }}
        run: |
          on() { for v in "$@"; do [ "$v" = true ] && return 0; done; return 1; }
          on "$AMD64" "$ARM64" "$MAC" "$WIN" || { echo "check at least one OS" >&2; exit 1; }
          la='{"name":"linux-amd64","runner":"ubuntu-24.04","arch":"amd64"}'
          lb='{"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}'
          mc='{"name":"macos-universal","runner":"macos-14","arch":"universal"}'
          wn='{"name":"windows-x86_64","runner":"windows-2022","arch":"amd64"}'
          builds=()
          [ "$AMD64" = true ] && builds+=("$la")
          [ "$ARM64" = true ] && builds+=("$lb")
          [ "$MAC" = true ] && builds+=("$mc")
          [ "$WIN" = true ] && builds+=("$wn")
          # an empty matrix fails its job: a placeholder the jobs' if skips
          j() { [ $# -gt 0 ] || set -- '{"name":"none"}'; local IFS=,; echo "[$*]"; }
          echo "builds=$(j "${builds[@]}")" | tee -a "$GITHUB_OUTPUT"

  # the web client built once, from the workspace's pinned packages, for every
  # job that embeds it
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # a binary without it serves nothing but 404s
      - run: bun run web && test -f packages/server/webstatic/dist/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: |
            packages/server/webstatic/dist/
            packages/server/webstatic/src/manifest.ts
          retention-days: 1

  # every production dependency under an allowed license, and the shipped notices
  # and SBOM generated from them and the pinned tools, beside the builds
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/licenses.ts notices
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notices
          path: notices/
          retention-days: 1

  # one job per OS: Linux's host the .deb around the binary, macOS's and
  # Windows' the menu bar app beside it, in a .dmg and a setup .exe
  build:
    needs: [version, web, licenses]
    if: ${{ inputs.linux_amd64 || inputs.linux_arm64 || inputs.macos || inputs.windows }}
    strategy:
      # one OS's failure leaves the others' builds, and their caches, finished
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VER: ${{ needs.version.outputs.ver }}
      APP: packaging/host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # apt key's public half, into the host package
      - name: apt key
        if: startsWith(matrix.name, 'linux')
        env:
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          export GNUPGHOME=$(mktemp -d)
          echo "$KEY" | gpg --batch --import
          gpg --export > "$RUNNER_TEMP/phosphorus.gpg"
          echo "PHOSPHORUS_APT_KEY=$RUNNER_TEMP/phosphorus.gpg" >> "$GITHUB_ENV"
      # the web client the web job built, into packages/server/webstatic before anything embeds it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: packages/server/webstatic
      # the notices and SBOM, shipped inside each installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notices
          path: notices
      # the release's tree (.github and packaging export-ignored) and its bundled tools;
      # Linux's packaged at once, the tools fetched beside the compile
      - name: host binary
        shell: bash
        run: |
          mkdir -p out upd art $APP/payload
          git archive HEAD | tar -x -C $APP/payload && echo "$VER" > $APP/payload/VERSION
          cp notices/THIRD_PARTY_NOTICES.txt notices/phosphorus.cdx.json $APP/payload/
          case "${{ matrix.name }}" in
            linux-*)
              packaging/tools.sh linux ${{ matrix.arch }} art/tools > art/tools.log 2>&1 & t=$!
              bun scripts/build.ts linux-$([ ${{ matrix.arch }} = amd64 ] && echo x64 || echo arm64) art "$VER"
              wait $t || { cat art/tools.log; exit 1; }
              packaging/deb/build.sh "out/phosphorus_${VER}_${{ matrix.arch }}.deb" "$VER" $APP/payload ${{ matrix.arch }} art/phosphorus-host art/tools ;;
            macos-universal)
              packaging/tools.sh darwin universal $APP/payload/tools > art/tools.log 2>&1 || { cat art/tools.log; exit 1; } ;;
            windows-*)
              packaging/tools.sh windows amd64 $APP/payload/tools > art/tools.log 2>&1 || { cat art/tools.log; exit 1; } ;;
          esac
      # the menu bar app around the host binary and release; its own update, signed
      # for the feed, only with the signing key
      - name: host app
        if: ${{ !startsWith(matrix.name, 'linux') }}
        shell: bash
        env:
          FEED_URL: https://github.com/${{ github.repository }}/releases/download/update
          FEED_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # Authenticode for the Windows .exes (packaging/winsign.sh): Trusted Signing's account
          # (vars) and the app registration it signs as (secrets), or a .pfx certificate
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          if [ "${{ matrix.name }}" = macos-universal ]; then
            $APP/macos.sh "$VER" $APP/payload out upd
          else
            $APP/windows.sh "$VER" "$PWD/$APP/payload" "$PWD/out" "$PWD/upd"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: out-${{ matrix.name }}
          path: out/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upd-${{ matrix.name }}
          path: upd/
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

  release:
    needs: [version, licenses, build]
    # runs with unchecked OSes skipped, not when anything failed
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.ver }}
      FJ: ${{ needs.version.outputs.forgejo }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: out
          pattern: out-*
          merge-multiple: true
      # the SBOM beside the installers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: notices
          path: notices
      - run: cp notices/phosphorus.cdx.json out/phosphorus-$VER.cdx.json
      # the notes: how to install, the assets listed by GitHub under them
      - name: notes
        run: |
          cd out
          {
            shopt -s nullglob
            # the install steps, each OS's only when built
            echo "You need a [Tailscale](https://tailscale.com) account and a reusable auth key."
            echo
            step() { echo "- $1"; }
            [ -e phosphorus-$VER-macos-universal.dmg ] && step "**macOS:** open the \`.dmg\`, drag Phosphorus to Applications, open it (first time: right-click, Open). It lives in the menu bar."
            [ -e phosphorus-$VER-windows-x86_64-setup.exe ] && step "**Windows:** run the setup \`.exe\` (SmartScreen: More info, Run anyway). It lives in the tray."
            ls phosphorus_${VER}_*.deb >/dev/null 2>&1 && step "**Linux:** \`sudo apt install ./phosphorus_${VER}_ARCH.deb\`, then \`sudo phosphorus\`. It bundles Forgejo ${FJ} (GPL-3.0), source: [forgejo-src-${FJ}.tar.gz](https://codeberg.org/forgejo/forgejo/releases/download/v${FJ}/forgejo-src-${FJ}.tar.gz)."
            echo
            echo "Then enter the Tailscale auth key when asked; every other host copies the rest from the mesh. Open \`http://HOST\` from any device on the tailnet, by a host's name or tailnet IP. The first login is \`admin\` with your admin password."
            echo
            echo "Installed hosts update themselves: **Check for Updates** in the menu bar or tray, \`phos update all\`, or the mesh update in the browser, every host at once."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VER }}
          name: Phosphorus ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: out/*

  # the update feed beside the release, not after it: nothing in it waits on the numbered
  # release's upload, and the upload nothing on it
  feed:
    needs: [version, licenses, build]
    if: ${{ !cancelled() && !failure() && (inputs.linux_amd64 || inputs.linux_arm64 || inputs.macos || inputs.windows) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      # the .debs, for the apt index
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: out
          pattern: out-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: upd
          pattern: upd-*
          merge-multiple: true
      # built OSes' files onto `update`; others: last release's
      - name: update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          mkdir -p upd && cd upd
          BASE=https://github.com/$GH_REPO/releases/download/update
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ${{ inputs.linux_amd64 || inputs.linux_arm64 || inputs.macos || inputs.windows }}; then
            printf '{"version":"%s","pub_date":"%s","notes":"https://github.com/%s/releases/tag/v%s"}\n' "$VER" "$NOW" "$GH_REPO" "$VER" > latest.json
          fi
          feed() { printf '{"version":"%s","url":"%s/%s","signature":"%s"}\n' "$VER" "$BASE" "$2" "$(cat "$2.sig")" > "$1.json"; }
          if [ -e phosphorus-macos-universal.app.tar.gz ]; then
            feed darwin-x86_64 phosphorus-macos-universal.app.tar.gz
            feed darwin-aarch64 phosphorus-macos-universal.app.tar.gz
          fi
          if [ -e phosphorus-windows-x86_64-setup.exe ]; then feed windows-x86_64 phosphorus-windows-x86_64-setup.exe; fi
          # Linux hosts update over apt
          # the apt feed: the host packages alone
          if [ -n "$KEY" ] && ls ../out/phosphorus_*.deb >/dev/null 2>&1; then
            command -v apt-ftparchive >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q apt-utils; }
            # the unchecked arch's index kept from the last release
            gh release download update -p 'Packages-*' || true
            for f in ../out/phosphorus_*.deb; do
              d=${f##*_}; d=${d%.deb} n=${f##*/}; n=${n%%_*}
              mkdir -p "a-$d" && cp "$f" "a-$d/${n}_$d.deb"
              (cd "a-$d" && apt-ftparchive packages .) > "Packages-$d"
              mv "a-$d/${n}_$d.deb" . && rmdir "a-$d"
            done
            cat Packages-* > Packages
            # agents' apt-get allows the Origin and Label change
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Phosphorus -o APT::FTPArchive::Release::Label=Phosphorus release . > "$RUNNER_TEMP/Release"
            export GNUPGHOME=$(mktemp -d)
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --clearsign -o InRelease "$RUNNER_TEMP/Release"
          fi
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --latest=false --title "Update feed" --notes "Files installed hosts update from. Install from the numbered releases."
          gh release upload update * --clobber

  # only the two newest numbered releases and their tags kept, the `update` feed
  # aside; only this workflow's two newest runs, this one included; of the bun
  # caches only this lockfile's
  prune:
    needs: [version, release, feed]
    if: ${{ !cancelled() && needs.release.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.feed.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: releases
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do
            echo "deleting release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
      - name: caches
        env:
          LOCK: ${{ needs.version.outputs.lock }}
        run: |
          gh cache list --limit 200 --json id,key --jq ".[] | select(.key | startswith(\"bun-\")) | select(.key | endswith(\"-$LOCK\") | not) | .id" |
          while read -r id; do
            echo "deleting cache $id"
            gh cache delete "$id" || true
          done
      - name: runs
        run: |
          gh run list --workflow release.yml --limit 200 --json databaseId,createdAt,status --jq 'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            echo "deleting run $id"
            gh run delete "$id" || true
          done
