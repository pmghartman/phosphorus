# one short pass on every pull request: install, the web build, types, the formatter, tests
name: check

on:
  pull_request:

permissions:
  contents: read

# a new push to the PR supersedes the run before it
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun
      # the web build first: tsc reads its manifest
      - run: bun run web
      - run: bun run check
      # the formatter's word on the whole tree
      - run: bun run lint
      - run: bun run test
