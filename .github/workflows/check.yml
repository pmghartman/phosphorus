# one short pass on every pull request: install, the web build, types, the formatter, tests
name: check

on:
  pull_request:

permissions:
  contents: read

env:
  # bun's package cache in one place, kept between runs by actions/cache
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

# a new push to the PR supersedes the run before it
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # the web build first: tsc reads its manifest
      - run: bun run web
      - run: bun run check
      # the formatter's word on the whole tree
      - run: bun run lint
      - run: bun run test
