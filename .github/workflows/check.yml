# types and tests on every pull request
name: check

on:
  pull_request:

permissions:
  contents: read

env:
  # bun's package cache in one place on every OS, kept between runs by actions/cache
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

# a new push to the PR supersedes the run before it
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # tsc reads the same on every OS: once; the web build first, for its manifest
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run web
      - run: bun run check

  # tests on Linux and Windows: macOS has no tests of its own, its parsers' run
  # on fixtures everywhere
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, runner: ubuntu-24.04 }
          - { name: windows, runner: windows-2022 }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bun-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run web
      - run: bun run test
