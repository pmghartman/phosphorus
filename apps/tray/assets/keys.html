<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphorus Keys</title>
<style>
  /* the theme library's colors, light and dark, put here by the tray (keys.ts) */
  /*theme*/
  * { box-sizing: border-box; }
  body { margin: 0; padding: 34px 24px 22px; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; color: var(--muted); }
  label { display: block; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .name { font-weight: 600; }
  .state { font-size: 11px; }
  .state.set { color: var(--ok); }
  .state.unset { color: var(--muted); }
  input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--fg); font: 13px ui-monospace, Menlo, Consolas, monospace; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .foot { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
  .err { color: var(--bad); flex: 1; }
  button { padding: 6px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  body { max-width: 520px; margin: 0 auto; }
</style>
</head>
<body>
<h1>Keys</h1>
<p class="lead" id="lead">The saved key is never shown. Paste a new one to replace it, or leave the field blank to keep what's set.</p>
<form id="f" autocomplete="off"></form>
<div class="foot">
  <span class="err" id="err"></span>
  <button type="button" id="cancel">Cancel</button>
  <button type="submit" form="f" class="primary" id="save">Save</button>
</div>
<script>
  const MAIN = ['MESH_KEY', 'Mesh join key', 'From settings, network on a mesh host. The only key a host needs; everything else is set up on the desktop.'];
  // the tray's own server, on this machine only, behind this page's random path
  const call = async (path, body) => {
    const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || `failed (${r.status})`);
    return out;
  };
  const done = (text) => {
    document.getElementById('lead').textContent = text;
    form.replaceChildren();
    document.querySelector('.foot').hidden = true;
    window.close();
  };
  const form = document.getElementById('f');
  const err = document.getElementById('err');
  const save = document.getElementById('save');

  function field([name, label, hint], set) {
    const l = document.createElement('label');
    const row = document.createElement('div');
    row.className = 'row';
    const n = document.createElement('span');
    n.className = 'name';
    n.textContent = label;
    const s = document.createElement('span');
    s.className = 'state ' + (set ? 'set' : 'unset');
    s.textContent = set ? 'set' : 'not set';
    row.append(n, s);
    const i = document.createElement('input');
    i.type = 'text';
    i.autocomplete = 'off';
    i.autocapitalize = 'off';
    i.name = name;
    i.spellcheck = false;
    i.placeholder = set ? 'paste to replace' : name;
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = hint;
    l.append(row, i, h);
    return l;
  }

  call('status').then((set) => {
    if (!set.MESH_KEY) {
      document.getElementById('lead').textContent = 'First start. Only the mesh join key is needed; the desktop walks you through the rest.';
    }
    form.replaceChildren(field(MAIN, !!set.MESH_KEY));
    form.querySelector('input').focus();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    save.disabled = true;
    const values = Object.fromEntries([...form.querySelectorAll('input')].map((i) => [i.name, i.value.trim()]));
    try {
      const r = await call('save', { values });
      if (!r.starting) { done('Nothing changed. You can close this tab.'); return; }
      document.getElementById('lead').textContent = 'Saved. Starting Phosphorus…';
      form.replaceChildren();
      document.querySelector('.foot').hidden = true;
      // the frontend once phosphorus is up, in this tab
      for (;;) {
        await new Promise((ok) => setTimeout(ok, 1500));
        const s = await call('started').catch(() => ({}));
        if (s.error) { done(`Phosphorus didn't start: ${s.error}`); return; }
        if (s.url) { location.href = s.url; return; }
      }
    } catch (x) {
      err.textContent = x.message;
      save.disabled = false;
    }
  });
  document.getElementById('cancel').addEventListener('click', () => done('Nothing changed. You can close this tab.'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') done('Nothing changed. You can close this tab.'); });
</script>
</body>
</html>
