# no auth, tailnet membership the trust boundary, host networking binding
# the LAN too, so only the CGNAT range may pull
port = 8873
hosts allow = 100.64.0.0/10
hosts deny = *
use chroot = false
# daemon default nobody, unable to read git-owned 600/750 files
uid = root
gid = root
pid file = /var/run/rsyncd.pid

[gitdata]
    path = /var/lib/phosphorus/git
    read only = true
    list = false
    # peers pull conf/custom/obj only, litefs kept out
    exclude = /litefs/ /litefs-internal/
    # set by the elector while a new master's final pull lands
    pre-xfer exec = test ! -e /run/git-promoting
