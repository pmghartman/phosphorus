# rendered once by git-daemon.sh, then rsynced from the master with the rest of conf/

APP_NAME = phosphorus git
RUN_MODE = prod
RUN_USER = phosphorus-git
WORK_PATH = /var/lib/phosphorus/git

[server]
DOMAIN           = git.example.ts.net
HTTP_ADDR        = 0.0.0.0
HTTP_PORT        = 3001
ROOT_URL         = https://git.example.ts.net/
DISABLE_SSH      = true
LFS_START_SERVER = true
APP_DATA_PATH    = /var/lib/phosphorus/git/obj
LFS_JWT_SECRET   = lfs-jwt-fixture

[database]
DB_TYPE = sqlite3
PATH    = /var/lib/phosphorus/git/db/forgejo.db

[session]
PROVIDER = db

[queue]
DATADIR = /var/lib/phosphorus/git/state/queues

[indexer]
ISSUE_INDEXER_PATH = /var/lib/phosphorus/git/state/indexers/issues.bleve
REPO_INDEXER_PATH  = /var/lib/phosphorus/git/state/indexers/repos.bleve

[log]
ROOT_PATH = /var/lib/phosphorus/git/state/log

[repository]
ROOT = /var/lib/phosphorus/git/obj/forgejo-repositories

[lfs]
PATH = /var/lib/phosphorus/git/obj/lfs

[picture]
AVATAR_UPLOAD_PATH      = /var/lib/phosphorus/git/obj/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = /var/lib/phosphorus/git/obj/repo-avatars

[attachment]
PATH = /var/lib/phosphorus/git/obj/attachments

[packages]
PATH = /var/lib/phosphorus/git/obj/packages

[security]
INSTALL_LOCK   = true
SECRET_KEY     = fixture-secret-key
INTERNAL_TOKEN = fixture.internal.token

[oauth2]
JWT_SECRET = oauth-jwt-fixture

[cron.git_gc_repos]
ENABLED  = true
SCHEDULE = @every 24h
