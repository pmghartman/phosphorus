version: "3.7"
services:
  demo:
    image: example/demo:2.0
    ports:
      - ${APP_PORT}:80
    environment:
      - ADMIN=${DEMO_ADMIN_PASSWORD}
      - URL=${APP_PROTOCOL:-https}://${APP_DOMAIN}
      - MODE=${DEMO_MODE}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${ROOT_FOLDER_HOST}/media/movies:/movies
    depends_on:
      - demo-db
    networks:
      - tipi_main_network
    labels:
      traefik.enable: true
      runtipi.managed: true
  demo-db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${DEMO_DB_PASSWORD}
      - POSTGRES_USER=demo
    volumes:
      - ${APP_DATA_DIR}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
    networks:
      - tipi_main_network
