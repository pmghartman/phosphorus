<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sulfur</title>
<style>
  /* the app's one page of its own: which Phosphorus server, then that server's Sulfur */
  :root {
    --bg: #141414; --card: #1b1b1b; --fg: #e0e0e0; --muted: #9d9d9d; --border: #2e2e2e;
    --accent: #f6a531; --accent-fg: #1a1206; --bad: #f85149; --input: #101010;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f7f8; --card: #ffffff; --fg: #1f1f23; --muted: #6b6b73; --border: #e4e4e7; --accent: #c4620f; --accent-fg: #ffffff; --bad: #cf222e; --input: #ffffff; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%), var(--bg);
    color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Ubuntu, sans-serif;
  }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .mark { width: 112px; height: 112px; filter: drop-shadow(0 12px 28px rgb(0 0 0 / 0.35)); }
  h1 { margin: 18px 0 4px; font-size: 26px; font-weight: 600; letter-spacing: 0.01em; }
  .lede { margin: 0 0 24px; color: var(--muted); }
  form { width: 100%; display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--input); color: var(--fg); font: inherit; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  button { height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font: inherit; font-weight: 600; cursor: pointer; }
  .go { background: var(--accent); color: var(--accent-fg); }
  .go:hover { filter: brightness(1.08); }
  .go:disabled { opacity: 0.6; cursor: default; }
  .plain { background: none; color: var(--muted); border-color: var(--border); font-weight: 400; }
  .plain:hover { color: var(--fg); }
  .msg { min-height: 21px; margin: 12px 0 0; color: var(--muted); }
  .msg.bad { color: var(--bad); }
  .recent { width: 100%; margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
  .recent:empty { display: none; }
  .recent-head { font-size: 12px; color: var(--muted); text-align: left; text-transform: uppercase; letter-spacing: 0.06em; }
  .server { display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px; text-align: left; background: var(--card); color: var(--fg); border-color: var(--border); font-weight: 400; }
  .server:hover { border-color: var(--accent); }
  .server span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .forget { color: var(--muted); padding: 0 4px; }
  .forget:hover { color: var(--bad); }
  .hint { margin-top: 28px; font-size: 12px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="72 72 880 880" aria-hidden="true">
    <defs>
      <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2140"/><stop offset="0.55" stop-color="#16121f"/><stop offset="1" stop-color="#0c0a10"/></linearGradient>
      <radialGradient id="ember" cx="0.5" cy="0.62" r="0.55"><stop offset="0" stop-color="#f0883e" stop-opacity="0.32"/><stop offset="0.6" stop-color="#a371f7" stop-opacity="0.08"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
      <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="420" y1="214" x2="604" y2="812"><stop offset="0" stop-color="#fff3a3"/><stop offset="0.35" stop-color="#ffd84d"/><stop offset="0.75" stop-color="#f6a531"/><stop offset="1" stop-color="#f0783e"/></linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    </defs>
    <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#tile)"/>
    <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#ember)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#f6a531" stroke-width="60" opacity="0.55" filter="url(#glow)"><path d="M512 214 L700 528 L324 528 Z"/><path d="M512 528 V812 M396 682 H628"/></g>
      <path d="M512 214 L700 528 L324 528 Z" fill="url(#ink)" fill-opacity="0.12" stroke="none"/>
      <g stroke="url(#ink)" stroke-width="58"><path d="M512 214 L700 528 L324 528 Z"/><path d="M512 528 V812 M396 682 H628"/></g>
    </g>
  </svg>
  <h1>Sulfur</h1>
  <p class="lede">Your Phosphorus mesh’s code editor.</p>

  <form id="form" autocomplete="off">
    <input id="addr" type="text" spellcheck="false" placeholder="A host of your mesh, like d6 or 100.64.0.7" aria-label="Phosphorus server">
    <button class="go" id="go" type="submit">Connect</button>
  </form>
  <div id="busy" hidden>
    <button class="plain" id="change" type="button">Change Server</button>
  </div>
  <p class="msg" id="msg" role="status"></p>

  <div class="recent" id="recent"></div>
  <p class="hint">This computer needs to be on your mesh’s tailnet. You log in once, as in a browser.</p>
</main>
<script>
  // the servers used, newest first, and the last one gone to straight away
  const KEY = 'sulfur-servers';
  const $ = (id) => document.getElementById(id);
  const servers = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; } catch { return []; } };
  const keep = (list) => { try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 8))); } catch {} };
  // what's typed as an origin: a bare host taken as http
  function norm(v) {
    let s = String(v || '').trim();
    if (!s) return null;
    if (!/^https?:\/\//i.test(s)) s = `http://${s}`;
    try {
      const u = new URL(s);
      return /^https?:$/.test(u.protocol) && u.hostname ? `${u.protocol}//${u.host}` : null;
    } catch { return null; }
  }
  // the app's own page, for the server's Sulfur to come back to: tauri://localhost, or http://tauri.localhost on Windows
  const shell = `${location.protocol}//${location.host}`;
  let gen = 0;

  function say(text, bad = false) { $('msg').textContent = text; $('msg').classList.toggle('bad', bad); }
  function idle() {
    gen += 1;
    $('form').hidden = false;
    $('busy').hidden = true;
    $('go').disabled = false;
    paintRecent();
    $('addr').focus();
  }

  async function go(origin) {
    const my = (gen += 1);
    const u = new URL(origin);
    $('form').hidden = true;
    $('busy').hidden = false;
    $('recent').replaceChildren();
    say(`Connecting to ${u.host}…`);
    const invoke = window.__TAURI__?.core?.invoke;
    if (invoke) {
      try {
        await invoke('reach', { host: u.hostname.replace(/^\[|\]$/g, ''), port: Number(u.port) || (u.protocol === 'https:' ? 443 : 80) });
      } catch (err) {
        if (my !== gen) return;
        idle();
        $('addr').value = u.host;
        say(`${String(err)}. Is this computer on your tailnet, and is Phosphorus running there?`, true);
        return;
      }
    }
    if (my !== gen) return;
    keep([origin, ...servers().filter((x) => x !== origin)]);
    location.href = `${origin}/?app=sulfur&shell=${encodeURIComponent(shell)}`;
  }

  function paintRecent() {
    const list = servers();
    const box = $('recent');
    box.replaceChildren();
    if (!list.length) return;
    box.append(Object.assign(document.createElement('div'), { className: 'recent-head', textContent: 'Recent' }));
    for (const s of list) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'server' });
      b.append(Object.assign(document.createElement('span'), { textContent: s.replace(/^http:\/\//, '') }));
      const x = Object.assign(document.createElement('span'), { className: 'forget', textContent: '×', title: 'Forget' });
      x.addEventListener('click', (e) => { e.stopPropagation(); keep(servers().filter((y) => y !== s)); paintRecent(); });
      b.append(x);
      b.addEventListener('click', () => go(s));
      box.append(b);
    }
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const o = norm($('addr').value);
    if (!o) { say('That isn’t a host name or address.', true); return; }
    go(o);
  });
  $('change').addEventListener('click', () => { say(''); idle(); $('addr').value = (servers()[0] || '').replace(/^http:\/\//, ''); $('addr').select(); });

  // opened again from Sulfur's File › Change Server: the form; else the last server at once
  const last = servers()[0];
  if (location.hash === '#change' || !last) { history.replaceState(null, '', location.pathname); idle(); if (last) $('addr').value = last.replace(/^http:\/\//, ''); }
  else go(last);
</script>
</body>
</html>
