[package]
name = "phosphorus-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Phosphorus Client: the mesh's frontend in a window, updating itself from the release feed"

[[bin]]
name = "Phosphorus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde_json = "1"

[profile.release]
strip = true
# no cross-crate LTO: release builds minutes faster, the binary a little larger
lto = false
codegen-units = 16
