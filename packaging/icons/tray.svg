<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="112 112 800 800" width="44" height="44">
  <!-- the macOS menu bar's template of web/static/phosphorus.svg: one color, its alpha the shape, the
       weave shown by gaps (the oval over the stem at the crown, the stem over the oval at the foot);
       rendered to apps/tray/assets/tray.png -->
  <defs>
    <path id="ring" fill-rule="evenodd" d="M117,512 A395,236 0 1,0 907,512 A395,236 0 1,0 117,512 Z M263,512 A249,172 0 1,1 761,512 A249,172 0 1,1 263,512 Z"/>
    <polygon id="stem" points="340,169 684,169 684,205 581,252 581,772 684,819 684,855 340,855 340,819 443,772 443,252 340,205"/>
    <mask id="m-stem" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use xlink:href="#ring" fill="#000" stroke="#000" stroke-width="64" clip-path="url(#crown)"/>
    </mask>
    <mask id="m-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use xlink:href="#stem" fill="#000" stroke="#000" stroke-width="64" clip-path="url(#foot)"/>
    </mask>
    <clipPath id="crown"><rect x="380" y="200" width="264" height="220"/></clipPath>
    <clipPath id="foot"><rect x="300" y="600" width="424" height="200"/></clipPath>
  </defs>
  <use xlink:href="#stem" fill="#000" mask="url(#m-stem)"/>
  <use xlink:href="#ring" fill="#000" mask="url(#m-ring)"/>
</svg>
