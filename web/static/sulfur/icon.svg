<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Sulfur's mark: the alchemists' sulfur, 🜍, a triangle over a cross, folded as Visual Studio
       Code's: one amber hue in flat tones, each of the triangle's bands over one corner and under
       the next, the bar over the stem, a soft shadow on each band where it passes under, rounded
       outer corners and one white sheen over the whole, on nothing.
       The source every platform's icon is made from -->
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc53d"/><stop offset="1" stop-color="#fbab22"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f28c16"/><stop offset="1" stop-color="#e47811"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cc610b"/><stop offset="1" stop-color="#bd5609"/></linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ad4c07"/><stop offset="1" stop-color="#c35c0a"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbb02a"/><stop offset="1" stop-color="#f29a18"/></linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="950"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="drop" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#4a1a00" flood-opacity="0.22"/></filter>
    <polygon id="p-stem" points="464,600 560,600 560,930 464,930" stroke-width="32" stroke-linejoin="round"/>
    <polygon id="p-bar" points="354,744 670,744 670,836 354,836" stroke-width="32" stroke-linejoin="round"/>
    <polygon id="p-base" points="247.5,532 190,626 723.8,626 666.2,532" stroke-width="32" stroke-linejoin="round"/>
    <polygon id="p-left" points="567.1,190 512,100 247.5,532 357.8,532" stroke-width="32" stroke-linejoin="round"/>
    <polygon id="p-right" points="723.8,626 834,626 567.1,190 512,280" stroke-width="32" stroke-linejoin="round"/>
    <!-- the weave is cyclic, so a band passing under is cut where its rounding would show over its neighbour -->
    <clipPath id="c-left"><polygon points="-100,-100 1124,-100 1124,532 -100,532"/></clipPath>
    <clipPath id="c-right"><polygon points="787,-170 1200,-170 1200,1200 17,1090"/></clipPath>
    <mask id="m-stem" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><use xlink:href="#p-stem" fill="#fff" stroke="#fff"/></mask>
    <mask id="m-base" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><use xlink:href="#p-base" fill="#fff" stroke="#fff"/></mask>
    <mask id="m-left" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><use xlink:href="#p-left" fill="#fff" stroke="#fff"/><rect x="-100" y="532" width="1224" height="600" fill="#000"/></mask>
    <mask id="m-right" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><use xlink:href="#p-right" fill="#fff" stroke="#fff"/></mask>
    <mask id="m-all" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1224" height="1224"><g fill="#fff" stroke="#fff"><use xlink:href="#p-stem"/><use xlink:href="#p-bar"/><use xlink:href="#p-base"/><use xlink:href="#p-left"/><use xlink:href="#p-right"/></g></mask>
  </defs>
  <g style="isolation:isolate">
    <g filter="url(#drop)">
      <use xlink:href="#p-stem" fill="url(#stem)" stroke="url(#stem)"/>
      <g mask="url(#m-stem)"><use xlink:href="#p-bar" fill="#4a1500" stroke="#4a1500" opacity="0.4" filter="url(#soft)"/><use xlink:href="#p-base" fill="#4a1500" stroke="#4a1500" opacity="0.4" filter="url(#soft)"/></g>
      <use xlink:href="#p-bar" fill="url(#bar)" stroke="url(#bar)"/>
      <use xlink:href="#p-base" fill="url(#deep)" stroke="url(#deep)"/>
      <g mask="url(#m-base)"><g clip-path="url(#c-right)"><use xlink:href="#p-right" fill="#4a1500" stroke="#4a1500" opacity="0.36" filter="url(#soft)"/></g></g>
      <g clip-path="url(#c-left)"><use xlink:href="#p-left" fill="url(#mid)" stroke="url(#mid)"/></g>
      <g mask="url(#m-left)"><use xlink:href="#p-base" fill="#4a1500" stroke="#4a1500" opacity="0.36" filter="url(#soft)"/></g>
      <g clip-path="url(#c-right)"><use xlink:href="#p-right" fill="url(#light)" stroke="url(#light)"/></g>
      <g clip-path="url(#c-right)"><g mask="url(#m-right)"><g clip-path="url(#c-left)"><use xlink:href="#p-left" fill="#4a1500" stroke="#4a1500" opacity="0.36" filter="url(#soft)"/></g></g></g>
    </g>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)" opacity="0.35" mask="url(#m-all)" style="mix-blend-mode:overlay"/>
  </g>
</svg>
