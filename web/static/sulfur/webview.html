<!doctype html>
<meta charset="utf-8">
<title>Extension webview</title>
<script>
// A real document URL lets routers resolve relative URLs. This loader accepts
// content only inside an opaque sandbox, never in a privileged same-origin page.
(() => {
  if (window.origin !== 'null' || parent === window) return;
  const token = location.hash.slice(1);
  if (!token) return;
  const receive = (event) => {
    if (event.source !== parent || event.data?.sulfurWebviewToken !== token || typeof event.data.html !== 'string') return;
    removeEventListener('message', receive);
    document.open();
    document.write(event.data.html);
    document.close();
  };
  addEventListener('message', receive);
  parent.postMessage({ sulfurWebviewReady: token }, '*');
})();
</script>
