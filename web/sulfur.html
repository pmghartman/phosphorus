<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141414">
<title>Sulfur</title>
<link rel="icon" type="image/svg+xml" href="/sulfur/icon.svg">
<link rel="stylesheet" href="/style.css">
<script>
// Sulfur's own light or dark (its Appearance setting), else the system's, and the color theme, before paint
(() => {
  let pick = null;
  try { pick = localStorage.getItem('sulfur-appearance'); } catch {}
  const light = pick === 'light' || (pick !== 'dark' && pick !== 'oled' && matchMedia('(prefers-color-scheme: light)').matches);
  if (pick === 'oled') document.documentElement.dataset.theme = 'oled';
  else if (light) document.documentElement.dataset.theme = 'light';
  // the theme as theme.js last put it up: its look, rounded corners, page font, a custom one's css
  const r = document.documentElement;
  let a = null;
  try { a = JSON.parse(localStorage.getItem('phosphorus-theme-applied')); } catch {}
  let look = a?.look;
  try { look = look || localStorage.getItem('phosphorus-palette'); } catch {}
  r.dataset.palette = look && look !== 'custom' ? look : 'phosphorus';
  if (a?.id) r.dataset.themeId = a.id;
  r.toggleAttribute('data-round', !!a?.round);
  r.toggleAttribute('data-sans', !!a?.sans);
  if (a?.css) {
    r.setAttribute('data-custom', '');
    r.toggleAttribute('data-custom-desk', !!a.desk);
    const s = document.createElement('style');
    s.id = 'phosphorus-custom';
    s.textContent = a.css;
    document.head.append(s);
  }
})();
</script>
</head>
<body class="sx-body">
<div id="sulfur"></div>
<script type="module" src="/src/sulfur/main.js"></script>
</body>
</html>
