<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f1f1f">
<title>Sulfur</title>
<link rel="icon" type="image/svg+xml" href="/sulfur/icon.svg">
<link rel="preload" href="/vendor/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script>
// the system's light or dark, before paint, as the desktop's page does
(() => {
  let pick = null;
  try { pick = localStorage.getItem('phosphorus-theme'); } catch {}
  const theme = pick || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  if (theme === 'light') document.documentElement.dataset.theme = theme;
})();
</script>
</head>
<body class="sx-body">
<div id="sulfur"></div>
<script type="module" src="/src/sulfur/main.js"></script>
</body>
</html>
