<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f1f1f">
<title>Sulfur</title>
<link rel="icon" type="image/svg+xml" href="/sulfur/icon.svg">
<link rel="preload" href="/vendor/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script>
// Sulfur's own light or dark (its Appearance setting), else the system's, before paint
(() => {
  let pick = null;
  try { pick = localStorage.getItem('sulfur-appearance'); } catch {}
  const light = pick === 'light' || (pick !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
  if (light) document.documentElement.dataset.theme = 'light';
})();
</script>
</head>
<body class="sx-body">
<div id="sulfur"></div>
<script type="module" src="/src/sulfur/main.js"></script>
</body>
</html>
